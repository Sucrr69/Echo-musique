<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Écho Musique : lecteur de musique hors ligne pour tes fichiers audio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Écho Musique</title>
<meta name="theme-color" content="#0e0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:'var(--bg)', surface:'var(--surface)', elev:'var(--elev)', line:'var(--line)', fg:'var(--fg)', muted:'var(--muted)', accent:'var(--accent)' },
  fontFamily: { display:['Unbounded','system-ui','sans-serif'], sans:['Figtree','system-ui','-apple-system','Segoe UI','sans-serif'] }
}}};
</script>
<style>
/* Layout: mobile-first — content column + mini player + bottom tabs; from 768px: fixed sidebar, content, full-width player bar. Single deliberate dark theme. */
:root{
  --bg:#0e0d12; --surface:#16141c; --elev:#221f2a; --line:#2e2a38;
  --fg:#f4f2f8; --muted:#a49eb0; --accent:#ff4f7b;
  --tabs:62px; --mini:64px; --bar:92px; --side:248px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Shell */
#side{display:none}
#main{padding-bottom:calc(var(--tabs) + var(--mini) + 28px + env(safe-area-inset-bottom,0px))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 85%,transparent));display:grid;grid-template-columns:repeat(3,1fr)}
#toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
body.dragging #main{outline:2px dashed var(--accent);outline-offset:-8px;border-radius:16px}
#mini{position:fixed;z-index:31;bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px) + 6px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px))}
#bar{display:none}
@media (min-width:768px){
  #side{display:flex;position:fixed;top:0;left:0;bottom:var(--bar);width:var(--side);padding-left:env(safe-area-inset-left,0px)}
  #main{margin-left:var(--side);padding-bottom:calc(var(--bar) + 32px)}
  #tabs,#mini{display:none}
  #bar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
    grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px}
}

/* Track rows */
.trow{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
@media (min-width:640px){.trow{grid-template-columns:28px 44px minmax(0,1fr) 110px auto auto 48px}}
.trow:hover{background:var(--elev)}
.trow.is-on{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tnum{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:center}
.tdur{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
.favbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.favbtn:hover{color:var(--fg)}
.favbtn.is-fav{color:var(--accent)}
.favbtn svg{width:20px;height:20px}
@media (max-width:639px){.tdur{display:none}}

/* Equalizer marker */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* Ranges */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;cursor:pointer;
  background:linear-gradient(90deg,#ff8eab,var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--line)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);border:0;box-shadow:0 0 0 4px rgba(255,79,123,.22),0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
.rng:active::-webkit-slider-thumb{transform:scale(1.25)}
.rng::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
.rng.lg{height:6px}
.rng.lg::-webkit-slider-thumb{width:18px;height:18px}

.ico svg{width:22px;height:22px}
.hscroll{scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.card .pbtn{opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .pbtn,.card:focus-within .pbtn{opacity:1;transform:none}
@media (hover:none){.card .pbtn{opacity:1;transform:none}}

/* Menus, dialog, queue */
.ovl{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.ovl[hidden],#qpanel[hidden]{display:none!important}
.sheetbox{background:var(--elev);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 14px);max-height:82vh;overflow-y:auto}
@media (min-width:768px){.ovl{align-items:center}.sheetbox{border-radius:16px;padding-bottom:14px}}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 20px;text-align:left;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--line)}
.mi svg{width:22px;height:22px;flex:none;color:var(--muted)}
#qpanel{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
@media (min-width:768px){#qpanel{left:auto;width:400px;bottom:var(--bar);border-left:1px solid var(--line);padding-bottom:24px}}

/* Now playing sheet */
#sheet{position:fixed;inset:0;z-index:50;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;
  background:linear-gradient(180deg,var(--tint,#3a2340) 0%,var(--bg) 78%)}
#sheet.open{transform:none;visibility:visible}
/* Depth: raised surfaces and a pressed state on every control */
button,.trow,#mini{transition:transform .16s cubic-bezier(.3,.7,.4,1),background-color .15s,color .15s,box-shadow .16s,filter .15s,opacity .2s}
button:active:not(:disabled){transform:scale(.93)}
.trow:active,#mini:active{transform:scale(.985)}
.raise{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.14),0 8px 18px -8px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.35)}
.raise:active:not(:disabled){transform:scale(.95);box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 2px 6px -3px rgba(0,0,0,.6)}
.soft{background-image:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 20px -12px rgba(0,0,0,.9),0 2px 5px rgba(0,0,0,.3)}
.soft:active:not(:disabled){transform:scale(.94);box-shadow:inset 0 2px 5px rgba(0,0,0,.35),0 2px 6px -4px rgba(0,0,0,.6)}
.hero-play{position:relative;color:var(--bg);background:linear-gradient(160deg,#ff8eab 0%,var(--accent) 48%,#d8295a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(110,0,40,.35),0 12px 26px -10px rgba(255,79,123,.85),0 3px 8px rgba(0,0,0,.45)}
.hero-play:hover{filter:brightness(1.07)}
.hero-play:active:not(:disabled){transform:scale(.9);box-shadow:inset 0 3px 8px rgba(110,0,40,.5),0 3px 10px -5px rgba(255,79,123,.6)}
.hero-play::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:2px solid var(--accent);opacity:0;pointer-events:none}
body.is-playing #sPlay::after,body.is-playing #bPlay::after{animation:ring 2.4s ease-out infinite}
#mini{background-image:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 32px -12px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.4)}
.prog-fill{background:linear-gradient(90deg,#ff8eab,var(--accent));will-change:transform}
#tabs button{position:relative}
#tabs button svg{transition:transform .25s cubic-bezier(.3,.7,.4,1.4)}
#tabs button[aria-current] svg{transform:translateY(-1px) scale(1.1)}
#tabs button[aria-current]::before{content:"";position:absolute;top:6px;width:18px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.welcome{background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),var(--surface);border:1px solid var(--line)}
.welcome-disc{color:var(--bg);background:linear-gradient(160deg,#ff8eab,var(--accent) 50%,#7b3cff);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 18px 40px -14px rgba(255,79,123,.8);animation:floaty 3.6s ease-in-out infinite}
.welcome-disc svg{width:44px;height:44px}

/* Motion (all transitions 200–400 ms) */
#mEq{display:none}
body.is-playing #mEq{display:inline-flex}
#sCover{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
body:not(.is-playing) #sCover{transform:scale(.94)}
body.is-playing #sCover{animation:breathe 3.2s ease-in-out infinite}
#main.entering > *{animation:viewIn .3s cubic-bezier(.2,.8,.2,1) both}
#main.entering .trow{animation:rowIn .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 20ms)}
#mini:not([hidden]){animation:miniIn .32s cubic-bezier(.2,.8,.2,1)}
.ovl:not([hidden]){animation:fadeIn .2s ease-out}
.ovl:not([hidden]) .sheetbox{animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
#qpanel:not([hidden]){animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
@media (min-width:768px){.ovl:not([hidden]) .sheetbox{animation:popIn .24s cubic-bezier(.2,.8,.2,1)}#qpanel:not([hidden]){animation:slideLeft .32s cubic-bezier(.2,.8,.2,1)}}
#toast:not([hidden]){animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes miniIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes slideLeft{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes ring{0%{opacity:.55;transform:scale(.95)}100%{opacity:0;transform:scale(1.25)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:1ms!important}
  body.is-playing #sCover,.welcome-disc,.hero-play::after{animation:none!important}
  .eq i{animation:none;height:10px}
}
</style>
</head>
<body>
<div id="app" class="min-h-full">
  <!-- Sidebar (desktop) -->
  <aside id="side" class="flex-col gap-2 p-3 bg-bg">
    <div class="px-3 pt-4 pb-5 flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-accent grid place-items-center text-bg"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>
      <span class="font-display font-bold text-lg tracking-tight">Écho</span>
    </div>
    <nav class="flex flex-col gap-1" id="sideNav"></nav>
    <div class="mt-4 pt-4 border-t border-line px-3 flex-1 min-h-0 overflow-y-auto">
      <div class="flex items-center justify-between mb-2">
        <p class="text-[11px] uppercase tracking-[.14em] text-muted">Ta bibliothèque</p>
        <button data-newpl class="w-8 h-8 grid place-items-center rounded-full text-muted hover:text-fg hover:bg-elev" aria-label="Créer une playlist"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      </div>
      <div id="sideLib" class="flex flex-col gap-1 mb-6"></div>
    </div>
  </aside>

  <!-- Main -->
  <main id="main" class="gutter md:pr-8 md:pl-8 pt-5 md:pt-8"></main>

  <!-- Mini player (mobile) -->
  <div id="mini" hidden class="rounded-xl bg-elev overflow-hidden" role="button" tabindex="0" aria-label="Ouvrir le lecteur">
    <div class="flex items-center gap-3 p-2 pr-1">
      <span class="relative shrink-0"><img id="mCover" alt="" class="w-11 h-11 rounded-md object-cover"><span id="mEq" class="eq absolute right-1 bottom-1 p-[3px] rounded bg-black/60" aria-hidden="true"><i></i><i></i><i></i></span></span>
      <div class="min-w-0 flex-1"><p id="mTitle" class="truncate font-semibold text-[15px]"></p><p id="mArtist" class="truncate text-sm text-muted"></p></div>
      <button id="mFav" class="favbtn" data-fav="" aria-label="Aimer"></button>
      <button id="mPlay" class="hero-play w-10 h-10 mr-1 rounded-full grid place-items-center ico [&_svg]:!w-5 [&_svg]:!h-5" aria-label="Lecture"></button>
    </div>
    <div class="h-[3px] bg-line mx-2 mb-[2px] rounded overflow-hidden"><div id="mProg" class="prog-fill h-full rounded origin-left" style="transform:scaleX(0)"></div></div>
  </div>

  <!-- Tabs (mobile) -->
  <nav id="tabs" class="gutter" aria-label="Navigation"></nav>

  <!-- Player bar (desktop) -->
  <footer id="bar" class="gutter bg-bg border-t border-line">
    <div class="flex items-center gap-3 min-w-0">
      <button id="bCoverBtn" class="shrink-0 rounded-md" aria-label="Ouvrir le lecteur en grand"><img id="bCover" alt="" class="w-14 h-14 rounded-md object-cover"></button>
      <div class="min-w-0"><p id="bTitle" class="truncate font-semibold"></p><p id="bArtist" class="truncate text-sm text-muted"></p></div>
      <button id="bFav" class="favbtn shrink-0" data-fav="" aria-label="Aimer"></button>
    </div>
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center gap-4">
        <button class="ctl-shuffle w-9 h-9 grid place-items-center text-muted hover:text-fg ico" aria-label="Lecture aléatoire" aria-pressed="false"></button>
        <button class="ctl-prev w-9 h-9 grid place-items-center text-fg ico" aria-label="Précédent"></button>
        <button id="bPlay" class="hero-play w-11 h-11 rounded-full grid place-items-center ico" aria-label="Lecture"></button>
        <button class="ctl-next w-9 h-9 grid place-items-center text-fg ico" aria-label="Suivant"></button>
        <button class="ctl-repeat w-9 h-9 grid place-items-center text-muted hover:text-fg ico relative" aria-label="Répéter" aria-pressed="false"></button>
      </div>
      <div class="w-full max-w-xl flex items-center gap-2 text-xs text-muted tabular-nums">
        <span id="bCur" class="w-10 text-right">0:00</span>
        <input id="bSeek" class="rng" type="range" min="0" max="1000" value="0" aria-label="Position">
        <span id="bDur" class="w-10">0:00</span>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2">
      <button id="bQueue" class="w-9 h-9 grid place-items-center text-muted hover:text-fg ico mr-2" aria-label="File d'attente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm12 0 6 3.5-6 3.5z"/></svg></button>
      <span class="text-muted ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></span>
      <input id="bVol" class="rng max-w-[130px]" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <!-- Now playing sheet -->
  <section id="sheet" class="gutter" aria-label="En cours de lecture" aria-hidden="true">
    <div class="max-w-md mx-auto flex flex-col gap-5">
      <div class="flex items-center justify-between">
        <button id="sClose" class="w-10 h-10 grid place-items-center ico" aria-label="Fermer le lecteur"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.6 5.4 9l1.4-1.4 5.2 5.2 5.2-5.2L18.6 9z"/></svg></button>
        <div class="text-center"><p class="text-[11px] uppercase tracking-[.14em] text-muted">Lecture depuis</p><p id="sCtx" class="text-sm font-semibold"></p></div>
        <button id="sQueue" class="w-10 h-10 grid place-items-center ico" aria-label="File d'attente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm12 0 6 3.5-6 3.5z"/></svg></button>
      </div>
      <img id="sCover" alt="" class="w-full aspect-square max-w-full rounded-xl object-cover shadow-2xl shadow-black/60">
      <canvas id="viz" class="w-full h-12" aria-hidden="true"></canvas>
      <div class="flex items-center gap-3">
        <div class="min-w-0 flex-1"><h2 id="sTitle" class="font-display font-bold text-xl leading-tight truncate"></h2><p id="sArtist" class="text-muted truncate mt-1"></p></div>
        <button id="sFav" class="favbtn !w-11 !h-11" data-fav="" aria-label="Aimer"></button>
      </div>
      <div>
        <input id="sSeek" class="rng lg" type="range" min="0" max="1000" value="0" aria-label="Position">
        <div class="flex justify-between text-xs text-muted tabular-nums mt-2"><span id="sCur">0:00</span><span id="sDur">0:00</span></div>
      </div>
      <div class="flex items-center justify-between px-1">
        <button class="ctl-shuffle w-11 h-11 grid place-items-center text-muted ico" aria-label="Lecture aléatoire" aria-pressed="false"></button>
        <button class="ctl-prev soft w-14 h-14 rounded-full grid place-items-center ico [&_svg]:!w-7 [&_svg]:!h-7" aria-label="Précédent"></button>
        <button id="sPlay" class="hero-play w-[76px] h-[76px] rounded-full grid place-items-center ico [&_svg]:!w-8 [&_svg]:!h-8" aria-label="Lecture"></button>
        <button class="ctl-next soft w-14 h-14 rounded-full grid place-items-center ico [&_svg]:!w-7 [&_svg]:!h-7" aria-label="Suivant"></button>
        <button class="ctl-repeat w-11 h-11 grid place-items-center text-muted ico relative" aria-label="Répéter" aria-pressed="false"></button>
      </div>
      <div class="flex items-center gap-3 text-muted">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="currentColor"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></svg>
        <input id="sVol" class="rng" type="range" min="0" max="100" value="80" aria-label="Volume">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </div>
      <p class="text-xs text-muted text-center">Sur iPhone, coupe le mode silencieux si tu n'entends rien.</p>
    </div>
  </section>
  <input id="fileIn" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" multiple hidden>
  <div id="toast" role="status" hidden></div>

  <section id="qpanel" class="gutter" hidden aria-label="File d'attente">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between h-12">
        <h2 class="font-display font-bold text-lg">File d'attente</h2>
        <button id="qClose" class="w-10 h-10 grid place-items-center ico" aria-label="Fermer la file d'attente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>

</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (!isFinite(s)) return '–:––'; s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

/* ---------------- Library: only the user's own files (loaded from IndexedDB) ---------------- */
const TRACKS = [];
const byId = id => TRACKS.find(t => t.id === id);
const gl = t => t.rec && t.rec.added ? 'Ajouté le ' + new Date(t.rec.added).toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) : '';
const hashHue = s => [...s].reduce((h,c) => (h*31 + c.charCodeAt(0)) >>> 0, 7) % 360;

/* ---------------- Generated covers ---------------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function makeCover(t){
  // Fallback artwork for files that have no embedded cover
  const S = 320, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), R = rng((t.id % 2147483647) || 7), [h1,h2] = t.hues;
  const grd = g.createLinearGradient(0,0,S,S);
  grd.addColorStop(0,`hsl(${h1} 72% 46%)`); grd.addColorStop(1,`hsl(${h2} 62% 14%)`);
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  g.lineWidth = 2;
  for (let r=30;r<260;r+=12){ g.strokeStyle = `hsla(${h1} 80% 78% / ${.05 + R()*.14})`; g.beginPath(); g.arc(160,160,r,0,Math.PI*2); g.stroke(); }
  g.fillStyle = 'rgba(0,0,0,.38)'; g.beginPath(); g.arc(160,160,72,0,Math.PI*2); g.fill();
  g.fillStyle = `hsl(${h1} 85% 74%)`; g.font = '700 64px Unbounded, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(([...t.title.trim()][0] || '♪').toUpperCase(), 160, 166);
  for (let i=0;i<1800;i++){ g.fillStyle = `rgba(255,255,255,${R()*.05})`; g.fillRect(R()*S, R()*S, 1, 1); }
  return c.toDataURL('image/jpeg', .86);
}
const COV = {};
COV[0] = makeCover({ id:0, title:'♪', hues:[330, 280] }); // placeholder shown before any music is added

/* ---------------- Icons ---------------- */
const P = d => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON = {
  play:P('M8 5.1v13.8a1 1 0 0 0 1.5.9l10.8-6.9a1 1 0 0 0 0-1.7L9.5 4.2A1 1 0 0 0 8 5.1z'),
  pause:P('M6 5h4v14H6zm8 0h4v14h-4z'),
  next:P('M16 5h2v14h-2zM5 5.8v12.4a.8.8 0 0 0 1.2.7l9-6.2a.8.8 0 0 0 0-1.4l-9-6.2A.8.8 0 0 0 5 5.8z'),
  prev:P('M6 5h2v14H6zm13 .8v12.4a.8.8 0 0 1-1.2.7l-9-6.2a.8.8 0 0 1 0-1.4l9-6.2a.8.8 0 0 1 1.2.7z'),
  shuffle:P('M14.8 4H20v5.2l-1.9-1.9-3.4 3.4-1.4-1.4 3.4-3.4L14.8 4zM4 18.6 16.6 6l1.4 1.4L5.4 20 4 18.6zm10.8 1.4 1.9-1.9-2.4-2.4 1.4-1.4 2.4 2.4L20 14.8V20h-5.2zM4 5.4 5.4 4l5.1 5.1-1.4 1.4L4 5.4z'),
  repeat:P('M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z'),
  heart:P('M12.1 18.6 12 18.7l-.1-.1C7.1 14.2 4 11.4 4 8.5 4 6.5 5.5 5 7.5 5c1.5 0 3 1 3.6 2.4h1.8C13.5 6 15 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.9-3.1 5.7-7.9 10.1zM16.5 3c-1.7 0-3.4.8-4.5 2.1C10.9 3.8 9.2 3 7.5 3 4.4 3 2 5.4 2 8.5c0 3.8 3.4 6.9 8.6 11.5L12 21.4l1.4-1.3c5.2-4.7 8.6-7.8 8.6-11.6C22 5.4 19.6 3 16.5 3z'),
  heartF:P('M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4z'),
  home:P('M12 3 3 10.5V21h6.5v-6h5v6H21V10.5L12 3z'),
  search:P('M10.5 3a7.5 7.5 0 0 1 6 12l4.7 4.7-1.5 1.5-4.7-4.7A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z'),
  lib:P('M4 3h2v18H4zm4 0h2v18H8zm4.6 1.3 1.9-.6 5.6 17-1.9.6z'),
  note:P('M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z'),
  plus:P('M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z'),
  trash:P('M9 3h6l1 1h4v2H4V4h4l1-1zM6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8z'),
  more:P('M6 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z'),
  queue:P('M3 5h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm12 0 6 3.5-6 3.5z'),
  pladd:P('M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm14-3h2v3h3v2h-3v3h-2v-3h-3v-2h3z'),
  up:P('M12 7.6 18.4 14 17 15.4l-5-5-5 5L5.6 14z'),
  down:P('M12 16.4 5.6 10 7 8.6l5 5 5-5 1.4 1.4z'),
  close:P('M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z'),
  edit:P('M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7z')
};
const EQ = '<span class="eq" aria-label="En lecture"><i></i><i></i><i></i></span>';

/* ---------------- State ---------------- */
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const isDemoId = id => typeof id === 'number' && id >= 1 && id <= 12; // ids of the removed demo catalogue
const S = {
  view:'home', genre:null, query:'',
  favs:new Set(store.get('echo-favs', []).filter(id => !isDemoId(id))),
  cur:null, ctx:'mine', loaded:false, shuffle:false, repeat:'off', vol:store.get('echo-vol', .8)
};
const saveFavs = () => store.set('echo-favs', [...S.favs]);
S.playlists = store.get('echo-playlists', []).filter(p => p && !(p.id === 1 && p.name === 'Soirée néons')).map(p => ({ ...p, ids:(p.ids || []).filter(id => !isDemoId(id)) }));
S.upNext = [];
const savePl = () => store.set('echo-playlists', S.playlists);
try { localStorage.removeItem('echo-hidedemo'); } catch(e){}
saveFavs(); savePl(); // write the cleaned lists back so no demo id survives in storage
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.view === 'home') renderMain(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (S.view === 'home') renderMain(); });

function ctxIds(key){
  if (key === 'favs') return TRACKS.filter(t => S.favs.has(t.id)).map(t => t.id);
  if (key === 'mine') return TRACKS.filter(t => t.file).map(t => t.id);
  if (key.startsWith('pl:')) { const pl = plById(+key.slice(3)); return pl ? pl.ids.filter(id => byId(id)) : []; }
  if (key === 'search') return searchResults().map(t => t.id);
  return TRACKS.map(t => t.id);
}
function ctxLabel(key){
  if (key === 'favs') return 'Titres likés';
  if (key === 'mine') return 'Ma musique';
  if (key.startsWith('pl:')) { const pl = plById(+key.slice(3)); return pl ? pl.name : 'Playlist'; }
  if (key === 'search') return 'Recherche';
  return 'Ma musique';
}
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function searchResults(){
  const q = norm(S.query.trim()); if (!q) return [];
  return TRACKS.filter(t => norm(t.title + ' ' + t.artist).includes(q));
}

/* ---------------- Audio engine: your files, routed through an analyser for the visualizer ---------------- */
const E = { ctx:null, master:null, analyser:null, offset:0, playing:false, routed:false };
function initAudio(){
  if (E.ctx) return true;
  try {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    E.ctx = ctx;
    E.master = ctx.createGain(); E.master.gain.value = S.vol;
    E.analyser = ctx.createAnalyser(); E.analyser.fftSize = 256; E.analyser.smoothingTimeConstant = .82;
    E.master.connect(E.analyser).connect(ctx.destination);
    try { ctx.createMediaElementSource(AU).connect(E.master); E.routed = true; AU.volume = 1; } catch(e){}
    return true;
  } catch(e){ return false; }
}
const AU = new Audio(); AU.preload = 'auto'; AU.setAttribute('playsinline', '');
const isFile = t => !!(t && t.url);
const durOf = t => t && t.duration > 0 && isFinite(t.duration) ? t.duration
  : (isFile(t) && AU.dataset.id == t.id && isFinite(AU.duration) ? AU.duration : NaN);
function pos(){
  const tr = byId(S.cur);
  return tr && AU.dataset.id == tr.id ? AU.currentTime : E.offset;
}
function halt(){
  if (!AU.paused) AU.pause();
  E.playing = false;
}
function startEngine(){
  const tr = byId(S.cur);
  if (!tr){ toast("Ajoute d'abord ta musique dans Ma musique."); return; }
  initAudio();
  halt();
  if (E.ctx) E.ctx.resume();
  if (AU.dataset.id != tr.id){ AU.src = tr.url; AU.dataset.id = tr.id; }
  const off = E.offset;
  if (off > 0){ if (AU.readyState >= 1) AU.currentTime = off; else AU.addEventListener('loadedmetadata', () => { AU.currentTime = off; }, {once:true}); }
  else if (AU.readyState >= 1 && AU.currentTime > 0) AU.currentTime = 0;
  E.playing = true;
  const p = AU.play(); if (p) p.catch(() => { E.playing = false; toast("Ce fichier ne peut pas être lu sur cet appareil."); refresh(); });
  updateMedia(); refresh();
}
function stopEngine(){
  if (!E.playing) return;
  E.offset = pos(); halt(); updateMedia(); refresh();
}
const togglePlay = () => E.playing ? stopEngine() : startEngine();
function playTrack(id, ctx){
  S.cur = id; if (ctx) S.ctx = ctx; E.offset = 0;
  startEngine(); updateNow();
}
function seekTo(sec){
  const tr = byId(S.cur), d = durOf(tr); if (!isFinite(d)) return;
  E.offset = Math.min(Math.max(0, sec), d - .1);
  if (isFile(tr) && AU.dataset.id == tr.id){ AU.currentTime = E.offset; return; }
  if (E.playing) startEngine();
}
AU.addEventListener('ended', () => { if (E.playing && isFile(byId(S.cur))) onEnded(); });
AU.addEventListener('pause', () => { if (E.playing && AU.paused && isFile(byId(S.cur))){ E.offset = AU.currentTime; E.playing = false; updateMedia(); refresh(); } });
AU.addEventListener('loadedmetadata', () => {
  const t = byId(+AU.dataset.id);
  if (isFile(t) && !(t.duration > 0) && isFinite(AU.duration)){ t.duration = t.rec.duration = AU.duration; DB.put(t.rec).catch(() => {}); refresh(); }
});
function nextId(dir){
  let ids = ctxIds(S.ctx); if (!ids.length) ids = TRACKS.map(t => t.id);
  if (!ids.length) return null;
  const i = ids.indexOf(S.cur);
  if (S.shuffle && ids.length > 1){ let n; do n = ids[Math.floor(Math.random()*ids.length)]; while (n === S.cur); return n; }
  if (i < 0) return ids[0];
  const j = i + dir;
  if (j >= ids.length) return S.repeat === 'all' || dir > 0 && S.repeat !== 'stop' ? ids[0] : null;
  if (j < 0) return ids[ids.length-1];
  return ids[j];
}
function next(){ const was = E.playing, n = S.upNext.length ? S.upNext.shift() : nextId(1); if (n == null) return; S.cur = n; E.offset = 0; was ? startEngine() : refresh(); updateNow(); }
function prev(){
  if (pos() > 3){ seekTo(0); refresh(); return; }
  const was = E.playing, n = nextId(-1); if (n == null) return; S.cur = n; E.offset = 0; was ? startEngine() : refresh(); updateNow();
}
function onEnded(){
  if (S.repeat === 'one'){ E.offset = 0; startEngine(); return; }
  if (S.upNext.length){ S.cur = S.upNext.shift(); E.offset = 0; startEngine(); updateNow(); return; }
  const ids = ctxIds(S.ctx), last = ids.indexOf(S.cur) === ids.length - 1;
  if (last && S.repeat === 'off' && !S.shuffle){ halt(); E.offset = 0; if (isFile(byId(S.cur))) AU.currentTime = 0; updateMedia(); refresh(); return; }
  const n = nextId(1); if (n == null){ halt(); refresh(); return; }
  S.cur = n; E.offset = 0; startEngine(); updateNow();
}
function setVol(v){
  S.vol = v; store.set('echo-vol', v);
  if (E.master) E.master.gain.setTargetAtTime(v, E.ctx.currentTime, .02);
  if (!E.routed) AU.volume = v;
  ['bVol','sVol'].forEach(id => { const el = $(id); el.value = Math.round(v*100); el.style.setProperty('--p', (v*100)+'%'); });
}

/* ---------------- Media Session (lock screen) ---------------- */
function updateMedia(){
  if (!('mediaSession' in navigator)) return;
  try {
    const t = byId(S.cur); if (!t) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist, album:gl(t), artwork:[{src:COV[t.id], sizes:'320x320', type:'image/jpeg'}] });
    navigator.mediaSession.playbackState = E.playing ? 'playing' : 'paused';
  } catch(e){}
}
try {
  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', startEngine);
    navigator.mediaSession.setActionHandler('pause', () => stopEngine());
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  }
} catch(e){}

/* ---------------- Rendering ---------------- */
function row(t, i, ctx){
  const on = t.id === S.cur, fav = S.favs.has(t.id), mine = ctx === 'mine';
  return `<div class="trow ${on ? 'is-on' : ''}" style="--i:${Math.min(i, 14)}" data-play="${t.id}" data-ctx="${ctx}" role="button" tabindex="0" aria-label="Lire ${esc(t.title)} de ${esc(t.artist)}">
    <span class="tnum">${on && E.playing ? EQ : i+1}</span>
    <img src="${COV[t.id]}" alt="" class="w-11 h-11 rounded-md object-cover">
    <span class="min-w-0"><span class="block truncate font-semibold ${on ? 'text-accent' : ''}">${esc(t.title)}</span><span class="block truncate text-sm text-muted">${esc(t.artist)}</span></span>
    <span class="hidden sm:block text-sm text-muted truncate">${gl(t)}</span>
    <button class="favbtn ${fav ? 'is-fav' : ''}" data-fav="${t.id}" aria-pressed="${fav}" aria-label="${fav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">${fav ? ICON.heartF : ICON.heart}</button>
    <button class="favbtn" data-more="${t.id}" data-ctx="${ctx}" aria-label="Plus d'options pour ${esc(t.title)}">${ICON.more}</button>
    <span class="tdur">${fmt(durOf(t))}</span>
  </div>`;
}
const list = (tracks, ctx) => `<div class="flex flex-col">${tracks.map((t,i) => row(t,i,ctx)).join('')}</div>`;
const totalDur = ts => { const m = Math.round(ts.reduce((a,t) => { const d = durOf(t); return a + (isFinite(d) ? d : 0); }, 0)/60); return m + ' min'; };
const bigPlay = ctx => `<button class="hero-play w-14 h-14 rounded-full grid place-items-center ico [&_svg]:!w-7 [&_svg]:!h-7" data-playctx="${ctx}" aria-label="Lire la sélection">${E.playing && S.ctx === ctx ? ICON.pause : ICON.play}</button>`;

function genreHeader(title, sub, img, tint, ctx, eyebrow, extra = ''){
  return `<header class="-mx-4 md:-mx-8 px-4 md:px-8 pt-4 pb-6 mb-2 rounded-b-2xl" style="background:linear-gradient(180deg,${tint},transparent)">
    <div class="flex flex-col sm:flex-row sm:items-end gap-5">
      ${img}
      <div class="min-w-0">
        <p class="text-[11px] uppercase tracking-[.14em] text-fg/80">${eyebrow}</p>
        <h1 class="font-display font-bold text-3xl md:text-5xl tracking-tight mt-1 [text-wrap:balance]">${esc(title)}</h1>
        <p class="text-muted mt-2">${sub}</p>
      </div>
    </div>
    <div class="mt-5 flex items-center gap-3">${bigPlay(ctx)}${extra}</div>
  </header>`;
}

function viewHome(){
  const h = new Date().getHours(), hello = h < 5 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  const mine = ctxIds('mine').map(byId), recent = mine.slice(-10).reverse();
  const head = `<div class="flex items-center justify-between gap-3">
      <h1 class="font-display font-bold text-2xl md:text-3xl tracking-tight">${hello}</h1>
      ${installEvt ? `<button data-install class="hero-play h-10 px-4 rounded-full font-semibold text-sm inline-flex items-center gap-2 [&_svg]:w-4 [&_svg]:h-4">${ICON.plus}Installer l'appli</button>` : ''}
    </div>`;
  if (!mine.length) return head + (S.loaded ? welcome() : '<p class="text-muted mt-8">Chargement de ta musique…</p>');
  const tiles = libEntries().slice(0, 6).map(x => `<button ${x.attr} class="soft flex items-center gap-3 bg-elev/70 hover:bg-elev rounded-lg overflow-hidden text-left pr-3 h-14 md:h-16">${x.img('h-full aspect-square')}<span class="font-semibold text-sm truncate">${esc(x.title)}</span></button>`).join('');
  const cards = recent.map(t => `
    <div class="card shrink-0 w-[150px] md:w-[176px] p-2.5 rounded-xl hover:bg-elev transition">
      <div class="relative">
        <img src="${COV[t.id]}" alt="" class="w-full aspect-square rounded-lg object-cover shadow-lg shadow-black/40">
        <button class="pbtn hero-play absolute right-2 bottom-2 w-11 h-11 rounded-full grid place-items-center ico" data-play="${t.id}" data-ctx="mine" aria-label="Lire ${esc(t.title)}">${t.id === S.cur && E.playing ? ICON.pause : ICON.play}</button>
      </div>
      <p class="font-semibold mt-2.5 truncate">${esc(t.title)}</p>
      <p class="text-sm text-muted truncate">${esc(t.artist)}</p>
    </div>`).join('');
  return `${head}
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 md:gap-3 mt-5">${tiles}</div>
    <section class="mt-9">
      <div class="flex items-baseline justify-between"><h2 class="font-display font-bold text-lg md:text-xl">Ajoutés récemment</h2><button data-import class="text-sm font-semibold text-muted hover:text-fg">+ Ajouter</button></div>
      <div class="hscroll flex gap-1 overflow-x-auto -mx-2 mt-3 pb-1">${cards}</div>
    </section>
    <section class="mt-8">
      <div class="flex items-baseline justify-between mb-2"><h2 class="font-display font-bold text-lg md:text-xl">Tous tes titres</h2><span class="text-sm text-muted">${nt(mine.length)} · ${totalDur(mine)}</span></div>
      ${list(mine, 'mine')}
    </section>`;
}
function welcome(){
  return `<section class="welcome mt-6 rounded-3xl px-6 py-10 md:p-12 text-center">
    <div class="welcome-disc mx-auto w-24 h-24 rounded-full grid place-items-center">${ICON.note}</div>
    <h2 class="font-display font-bold text-xl md:text-2xl mt-6 [text-wrap:balance]">Ta bibliothèque est vide</h2>
    <p class="text-muted mt-2 max-w-sm mx-auto">Ajoute tes propres morceaux pour commencer. Ils restent sur ton appareil, rien n'est envoyé en ligne.</p>
    <button data-import class="raise mt-6 h-12 px-6 rounded-full bg-fg text-bg font-semibold inline-flex items-center gap-2 [&_svg]:w-5 [&_svg]:h-5">${ICON.plus}Ajouter mes musiques</button>

const DB = (() => {
  let p;
  const open = () => p = p || new Promise((res, rej) => {

    r.onupgradeneeded = () => r.result.createObjectStore('songs', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('songs', mode), req = fn(t.objectStore('songs'));

})();

function dec(bytes, enc){
  try {
    if (enc === 1){
      if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
      if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
      return new TextDecoder('utf-16le').decode(bytes);
    }
    if (enc === 2) return new TextDecoder('utf-16be').decode(bytes);
    if (enc === 3) return new TextDecoder('utf-8').decode(bytes);
    return new TextDecoder('iso-8859-1').decode(bytes);
  } catch(e){ return ''; }
}

  let o = 10; const end = Math.min(b.length, ss(6) + 10);
  if (b[5] & 0x40) o += ver === 4 ? ss(10) : be(10) + 4;

    if (ver === 2){ id = String.fromCharCode(b[o],b[o+1],b[o+2]); sz = (b[o+3]<<16) | (b[o+4]<<8) | b[o+5]; h = 6; }
    else { id = String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]); sz = ver === 4 ? ss(o+4) : be(o+4); h = 10; }
    if (!/^[A-Z0-9]{3,4}$/.test(id) || sz <= 0) break;
    const f = b.subarray(o + h, Math.min(end, o + h + sz));
    if (id === 'TIT2' || id === 'TT2') out.title = cleanTag(dec(f.subarray(1), f[0]));
    else if (id === 'TPE1' || id === 'TP1') out.artist = cleanTag(dec(f.subarray(1), f[0]));
    else if ((id === 'APIC' || id === 'PIC') && !out.pic){
      const enc = f[0]; let p = 1, mime;
      if (id === 'PIC'){ mime = 'image/' + String.fromCharCode(f[1],f[2],f[3]).toLowerCase().replace('jpg','jpeg'); p = 4; }
      else { let q = p; while (q < f.length && f[q]) q++; mime = dec(f.subarray(p, q), 0) || 'image/jpeg'; p = q + 1; }
      p++;
      if (enc === 1 || enc === 2){ while (p + 1 < f.length && !(f[p] === 0 && f[p+1] === 0)) p += 2; p += 2; }
      else { while (p < f.length && f[p]) p++; p++; }
      if (p < f.length) out.pic = { mime: mime.includes('/') ? mime : 'image/' + mime, data: f.slice(p) };
    }
    o += h + sz;
  }
  return out;
}
function parseFLAC(b){
  const out = {}, dv = new DataView(b.buffer, b.byteOffset, b.byteLength); let o = 4;
  while (o + 4 <= b.length){
    const hdr = b[o], type = hdr & 127, len = (b[o+1]<<16) | (b[o+2]<<8) | b[o+3], s = o + 4;
    if (s + len > b.length) break;
    if (type === 4){
      let p = s; p += 4 + dv.getUint32(p, true); const n = dv.getUint32(p, true); p += 4;
      for (let i = 0; i < n && p + 4 <= s + len; i++){
        const l = dv.getUint32(p, true); p += 4;
        const str = new TextDecoder().decode(b.subarray(p, p + l)); p += l;
        const k = str.indexOf('='), key = str.slice(0, k).toUpperCase(), val = str.slice(k + 1).trim();
        if (key === 'TITLE' && !out.title) out.title = val;
        if (key === 'ARTIST' && !out.artist) out.artist = val;
      }
    } else if (type === 6 && !out.pic){
      let p = s + 4; const ml = dv.getUint32(p); p += 4;
      const mime = new TextDecoder().decode(b.subarray(p, p + ml)); p += ml;
      p += 4 + dv.getUint32(p) + 16; const L = dv.getUint32(p); p += 4;
      out.pic = { mime, data: b.slice(p, p + L) };
    }
    if (hdr & 128) break; o = s + len;
  }
  return out;
}
function parseMP4(b){
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength), out = {};
  const kids = (s, e) => { const r = []; let o = s;
    while (o + 8 <= e){ let sz = dv.getUint32(o), h = 8; const ty = String.fromCharCode(b[o+4],b[o+5],b[o+6],b[o+7]);
      if (sz === 1){ sz = Number(dv.getBigUint64(o + 8)); h = 16; } else if (sz === 0) sz = e - o;
      if (sz < h || o + sz > e) break; r.push({ ty, s:o + h, e:o + sz }); o += sz; }
    return r; };
  const find = (l, ty) => l.find(a => a.ty === ty);
  const moov = find(kids(0, b.length), 'moov'); if (!moov) return out;
  const udta = find(kids(moov.s, moov.e), 'udta'); if (!udta) return out;
  const meta = find(kids(udta.s, udta.e), 'meta'); if (!meta) return out;
  const ilst = find(kids(meta.s + 4, meta.e), 'ilst'); if (!ilst) return out;
  for (const it of kids(ilst.s, ilst.e)){
    const d = find(kids(it.s, it.e), 'data'); if (!d) continue;
    const kind = dv.getUint32(d.s) & 0xffffff, payload = b.subarray(d.s + 8, d.e);
    if (it.ty === '©nam') out.title = new TextDecoder().decode(payload).trim();
    else if (it.ty === '©ART') out.artist = new TextDecoder().decode(payload).trim();
    else if (it.ty === 'covr' && !out.pic) out.pic = { mime: kind === 14 ? 'image/png' : 'image/jpeg', data: payload.slice() };
  }
  return out;
}
async function readTags(blob){
  try {
    const h = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    const s4 = o => String.fromCharCode(h[o], h[o+1], h[o+2], h[o+3]);
    if (h[0] === 0x49 && h[1] === 0x44 && h[2] === 0x33){
      const size = ((h[6]&127)<<21) | ((h[7]&127)<<14) | ((h[8]&127)<<7) | (h[9]&127);
      if (size > 30e6) return {};
      return parseID3(new Uint8Array(await blob.slice(0, size + 10).arrayBuffer()));
    }
    if (s4(0) === 'fLaC') return parseFLAC(new Uint8Array(await blob.slice(0, Math.min(blob.size, 30e6)).arrayBuffer()));
    if (s4(4) === 'ftyp' && blob.size < 80e6) return parseMP4(new Uint8Array(await blob.arrayBuffer()));
  } catch(e){}
  return {};
}
async function picToCover(pic){
  const url = URL.createObjectURL(new Blob([pic.data], { type:pic.mime }));
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement('canvas'); c.width = c.height = 320;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext('2d').drawImage(img, (img.naturalWidth - s)/2, (img.naturalHeight - s)/2, s, s, 0, 0, 320, 320);
    return c.toDataURL('image/jpeg', .86);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
async function enrich(t){
  const tags = await readTags(t.rec.blob);
  if (tags.title) t.title = t.rec.title = tags.title;
  if (tags.artist) t.artist = t.rec.artist = tags.artist;
  if (tags.pic){ const c = await picToCover(tags.pic); if (c){ t.rec.cover = c; COV[t.id] = c; } }
  t.rec.tagged = true; DB.put(t.rec).catch(() => {}); refresh();
}

/* ---------------- Library & playlists ---------------- */
const nt = n => n + ' titre' + (n > 1 ? 's' : '');
const plById = id => S.playlists.find(p => p.id === id);
function plCover(pl, cls){
  const ids = ctxIds('pl:' + pl.id);
  if (ids.length >= 4) return `<div class="${cls} grid grid-cols-2 overflow-hidden shrink-0">${ids.slice(0,4).map(id => `<img src="${COV[id]}" alt="" class="w-full h-full object-cover">`).join('')}</div>`;
  if (ids.length) return `<img src="${COV[ids[0]]}" alt="" class="${cls} object-cover shrink-0">`;
  return `<div class="${cls} grid place-items-center bg-elev text-muted shrink-0 ico">${ICON.note}</div>`;
}
const likedTile = cls => `<div class="${cls} grid place-items-center text-white shrink-0 ico" style="background:linear-gradient(135deg,#7b3cff,#ff4f7b)">${ICON.heartF}</div>`;
const mineTile = cls => `<div class="${cls} grid place-items-center text-white shrink-0 ico" style="background:linear-gradient(135deg,#ff8a3d,#c2185b)">${ICON.note}</div>`;
function libEntries(){
  return [
    { attr:'data-nav="favs"', img:likedTile, title:'Titres likés', sub:'Playlist · ' + nt(ctxIds('favs').length), on:S.view === 'favs' },
    { attr:'data-nav="mine"', img:mineTile, title:'Ma musique', sub:'Sur cet appareil · ' + nt(ctxIds('mine').length), on:S.view === 'mine' },
    ...S.playlists.map(pl => ({ attr:`data-pl="${pl.id}"`, img:cls => plCover(pl, cls), title:pl.name, sub:'Playlist · ' + nt(ctxIds('pl:' + pl.id).length), on:S.view === 'playlist' && S.plId === pl.id }))
  ];
}
function viewLibrary(){
  return `<div class="flex items-center justify-between gap-3 flex-wrap">
      <h1 class="font-display font-bold text-2xl md:text-3xl tracking-tight">Bibliothèque</h1>
      <button data-newpl class="raise h-10 px-4 rounded-full bg-fg text-bg font-semibold text-sm inline-flex items-center gap-2 [&_svg]:w-4 [&_svg]:h-4">${ICON.plus}Nouvelle playlist</button>
    </div>
    <div class="flex flex-col gap-1 mt-5">${libEntries().map(x => `<button ${x.attr} class="flex items-center gap-4 p-2 -mx-2 rounded-lg text-left hover:bg-elev">${x.img('w-16 h-16 rounded-md')}<span class="min-w-0"><span class="block font-semibold truncate">${esc(x.title)}</span><span class="block text-sm text-muted truncate">${x.sub}</span></span></button>`).join('')}</div>`;
}
function viewPlaylist(){
  const pl = plById(S.plId); if (!pl) return viewLibrary();
  const key = 'pl:' + pl.id, ts = ctxIds(key).map(byId), t0 = ts[0];
  const more = `<button data-plmenu="${pl.id}" class="w-11 h-11 grid place-items-center rounded-full text-muted hover:text-fg ico [&_svg]:!w-7 [&_svg]:!h-7" aria-label="Options de la playlist">${ICON.more}</button>`;
  const body = ts.length ? list(ts, key)
    : `<div class="py-10 text-center"><p class="font-display font-bold text-lg">Cette playlist est vide</p>
       <p class="text-muted mt-2 max-w-sm mx-auto">Touche ⋯ à côté d'un morceau, puis « Ajouter à une playlist ».</p>
       <button data-nav="search" class="raise mt-5 px-5 h-11 rounded-full bg-fg text-bg font-semibold">Chercher des titres</button></div>`;
  return genreHeader(pl.name, ts.length ? `${nt(ts.length)} · ${totalDur(ts)}` : 'Aucun titre pour l\'instant',
    plCover(pl, 'w-40 h-40 md:w-48 md:h-48 rounded-xl shadow-2xl shadow-black/50'), t0 ? `hsl(${t0.hues[0]} 50% 30%)` : '#3a3346', key, 'Playlist', more) + body;
}

/* ---------------- Menus & name dialog ---------------- */
let menuFns = [], dlgOk = null;
const trackHead = t => `<div class="flex items-center gap-3"><img src="${COV[t.id]}" alt="" class="w-12 h-12 rounded-md object-cover"><div class="min-w-0"><p class="font-semibold truncate">${esc(t.title)}</p><p class="text-sm text-muted truncate">${esc(t.artist)}</p></div></div>`;
function openMenu(head, items){
  menuFns = items.map(it => it.fn);
  $('menuBox').innerHTML = (head ? `<div class="px-5 pt-3 pb-3 mb-1 border-b border-line">${head}</div>` : '') +
    items.map((it, i) => `<button class="mi ${it.danger ? 'text-[#ff8a8a]' : ''}" data-mi="${i}" role="menuitem">${it.icon || ''}<span class="min-w-0 truncate">${esc(it.label)}</span>${it.hint ? `<span class="ml-auto pl-3 text-sm text-muted font-normal shrink-0">${esc(it.hint)}</span>` : ''}</button>`).join('');
  $('menu').hidden = false;
  const first = $('menuBox').querySelector('button'); if (first) first.focus({ preventScroll:true });
}
function closeMenu(){ $('menu').hidden = true; }
$('menu').addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('[data-mi]');
  if (b){ const fn = menuFns[+b.dataset.mi]; closeMenu(); if (fn) fn(); return; }
  if (e.target === $('menu')) closeMenu();
});
function openDlg(title, value, okLabel, onOk){
  $('dlgTitle').textContent = title; $('dlgOk').textContent = okLabel; dlgOk = onOk;
  const inp = $('dlgInput'); inp.value = value; $('dlg').hidden = false;
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
}
function closeDlg(){ $('dlg').hidden = true; dlgOk = null; }
$('dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('dlgInput').value.trim().slice(0, 60); if (!v){ $('dlgInput').focus(); return; }
  const fn = dlgOk; closeDlg(); if (fn) fn(v);
});
$('dlgCancel').onclick = closeDlg;
$('dlg').addEventListener('click', e => { e.stopPropagation(); if (e.target === $('dlg')) closeDlg(); });
$('dlgInput').addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });

function createPlaylist(ids = []){
  openDlg('Nouvelle playlist', `Ma playlist n° ${S.playlists.length + 1}`, 'Créer', name => {
    const pl = { id:Date.now(), name, ids:[...ids] }; S.playlists.push(pl); savePl();
    if (ids.length){ toast(`Ajouté à ${name}`); refresh(); } else { toast(`Playlist « ${name} » créée`); go('playlist', pl.id); }
  });
}
function openAddToPlaylist(id){
  const t = byId(id); if (!t) return;
  openMenu(`<p class="font-semibold">Ajouter à une playlist</p><p class="text-sm text-muted truncate">${esc(t.title)}</p>`, [
    { icon:ICON.plus, label:'Nouvelle playlist', fn:() => createPlaylist([id]) },
    ...S.playlists.map(pl => ({ icon:ICON.note, label:pl.name, hint:pl.ids.includes(id) ? 'Déjà dedans' : nt(ctxIds('pl:' + pl.id).length), fn:() => {
      if (pl.ids.includes(id)){ toast(`Déjà dans ${pl.name}`); return; }
      pl.ids.push(id); savePl(); toast(`Ajouté à ${pl.name}`); refresh();
    }}))
  ]);
}
function openTrackMenu(id, ctx){
  const t = byId(id); if (!t) return;
  const items = [
    { icon:ICON.queue, label:'Lire ensuite', fn:() => { S.upNext.unshift(id); toast('Sera lu juste après'); refresh(); } },
    { icon:ICON.queue, label:"Ajouter à la file d'attente", fn:() => { S.upNext.push(id); toast("Ajouté à la file d'attente"); refresh(); } },
    { icon:ICON.pladd, label:'Ajouter à une playlist', fn:() => openAddToPlaylist(id) }
  ];
  if (ctx && ctx.startsWith('pl:')){ const pl = plById(+ctx.slice(3));
    if (pl) items.push({ icon:ICON.close, label:'Retirer de cette playlist', fn:() => { pl.ids = pl.ids.filter(x => x !== id); savePl(); toast(`Retiré de ${pl.name}`); refresh(); } }); }
  items.push({ icon:ICON.search, label:"Voir les titres de l'artiste", fn:() => { S.query = t.artist; go('search'); } });
  if (t.file) items.push({ icon:ICON.trash, label:'Retirer de Ma musique', danger:true, fn:() => removeTrack(id) });
  openMenu(trackHead(t), items);
}
function openPlaylistMenu(plId){
  const pl = plById(plId); if (!pl) return;
  openMenu(`<p class="font-semibold truncate">${esc(pl.name)}</p><p class="text-sm text-muted">Playlist · ${nt(ctxIds('pl:' + pl.id).length)}</p>`, [
    { icon:ICON.queue, label:"Ajouter à la file d'attente", fn:() => { const ids = ctxIds('pl:' + pl.id); S.upNext.push(...ids); toast(`${nt(ids.length)} ajouté${ids.length > 1 ? 's' : ''} à la file`); refresh(); } },
    { icon:ICON.edit, label:'Renommer', fn:() => openDlg('Renommer la playlist', pl.name, 'Enregistrer', name => { pl.name = name; savePl(); refresh(); }) },
    { icon:ICON.trash, label:'Supprimer la playlist', danger:true, fn:() => openMenu(
      `<p class="font-semibold">Supprimer « ${esc(pl.name)} » ?</p><p class="text-sm text-muted">Les morceaux restent dans l'appli.</p>`, [
        { icon:ICON.trash, label:'Supprimer', danger:true, fn:() => { S.playlists = S.playlists.filter(p => p !== pl); savePl(); if (S.ctx === 'pl:' + pl.id) S.ctx = 'all'; toast('Playlist supprimée'); go('lib'); } },
        { icon:ICON.close, label:'Annuler', fn:null }
      ]) }
  ]);
}

/* ---------------- Queue ---------------- */
function upcomingCtx(){
  const ids = ctxIds(S.ctx), i = ids.indexOf(S.cur);
  let out = ids.slice(i + 1);
  if (S.repeat === 'all') out = out.concat(ids.slice(0, Math.max(0, i)));
  return out.slice(0, 25);
}
function openQueue(){ $('qpanel').hidden = false; renderQueue(); $('qClose').focus({ preventScroll:true }); }
function closeQueue(){ $('qpanel').hidden = true; }
function renderQueue(){
  if ($('qpanel').hidden) return;
  const cur = byId(S.cur), up = S.upNext.map(byId).filter(Boolean), after = upcomingCtx().map(byId).filter(Boolean);
  const lab = t => `<p class="text-[11px] uppercase tracking-[.14em] text-muted">${t}</p>`;
  const qrow = (t, attrs, extra) => `<div class="flex items-center gap-3 p-2 -mx-2 rounded-lg hover:bg-elev cursor-pointer" ${attrs} role="button" tabindex="0">
      <img src="${COV[t.id]}" alt="" class="w-11 h-11 rounded object-cover shrink-0">
      <div class="min-w-0 flex-1"><p class="truncate font-semibold">${esc(t.title)}</p><p class="truncate text-sm text-muted">${esc(t.artist)}</p></div>${extra || ''}</div>`;
  const sb = (a, i, icon, label, dis) => `<button class="w-9 h-9 grid place-items-center rounded-full text-muted hover:text-fg [&_svg]:w-5 [&_svg]:h-5 disabled:opacity-25 shrink-0" data-${a}="${i}" aria-label="${label}" ${dis ? 'disabled' : ''}>${icon}</button>`;
  $('qBody').innerHTML = `
    <div class="mt-2 mb-1">${lab('En cours')}</div>
    ${cur ? qrow(cur, 'data-qcur', E.playing ? `<span class="pr-2">${EQ}</span>` : '') : ''}
    <div class="flex items-center justify-between mt-6 mb-1">${lab('Dans ta file')}${up.length ? '<button data-qclear class="text-sm font-semibold text-muted hover:text-fg">Tout effacer</button>' : ''}</div>
    ${up.length ? up.map((t, i) => qrow(t, `data-qplay="${i}"`, sb('qup', i, ICON.up, 'Monter', i === 0) + sb('qdown', i, ICON.down, 'Descendre', i === up.length - 1) + sb('qdel', i, ICON.close, 'Retirer de la file'))).join('')
      : `<p class="text-sm text-muted py-2">Vide pour l'instant. Touche ⋯ à côté d'un titre, puis « Ajouter à la file d'attente ».</p>`}
    <div class="mt-6 mb-1">${lab('Ensuite, depuis ' + esc(ctxLabel(S.ctx)))}</div>
    ${S.shuffle ? `<p class="text-sm text-muted py-2">Lecture aléatoire activée : ces titres passent dans un ordre au hasard.</p>`
      : after.length ? after.map(t => qrow(t, `data-cplay="${t.id}"`)).join('') : `<p class="text-sm text-muted py-2">Plus rien après ce titre.</p>`}`;
}
$('qpanel').addEventListener('click', e => {
  const q = k => e.target.closest(`[data-${k}]`); let b;
  if ((b = q('qup'))){ const i = +b.dataset.qup; [S.upNext[i-1], S.upNext[i]] = [S.upNext[i], S.upNext[i-1]]; renderQueue(); return; }
  if ((b = q('qdown'))){ const i = +b.dataset.qdown; [S.upNext[i+1], S.upNext[i]] = [S.upNext[i], S.upNext[i+1]]; renderQueue(); return; }
  if ((b = q('qdel'))){ S.upNext.splice(+b.dataset.qdel, 1); renderQueue(); return; }
  if (q('qclear')){ S.upNext = []; renderQueue(); return; }
  if ((b = q('qplay'))){ const [id] = S.upNext.splice(+b.dataset.qplay, 1); playTrack(id); return; }
  if ((b = q('cplay'))){ playTrack(+b.dataset.cplay, S.ctx); return; }
  if (q('qcur')) togglePlay();
});
$('bQueue').onclick = openQueue; $('sQueue').onclick = openQueue; $('qClose').onclick = closeQueue;

/* ---------------- Boot ---------------- */
setVol(S.vol); renderMain(); renderNav(); updateNow(); updateMedia(); requestAnimationFrame(frame);
try { DB.all().then(rs => { (rs || []).sort((a,b) => a.added - b.added).forEach(r => { const t = addFileTrack(r); if (!r.tagged) enrich(t); }); afterLoad(); }).catch(afterLoad); } catch(e){ afterLoad(); }
function afterLoad(){
  S.loaded = true;
  if (!byId(S.cur)){ S.cur = ctxIds('mine')[0] ?? null; S.ctx = 'mine'; }
  updateMedia(); refresh();
}
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
