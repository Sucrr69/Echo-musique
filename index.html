<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="theme-color" content="#0e0d12">

<script>
tailwind.config = { theme: { extend: {
  colors: { bg:'var(--bg)', surface:'var(--surface)', elev:'var(--elev)', line:'var(--line)', fg:'var(--fg)', muted:'var(--muted)', accent:'var(--accent)' },
  fontFamily: { display:['Unbounded','system-ui','sans-serif'], sans:['Figtree','system-ui','-apple-system','Segoe UI','sans-serif'] }
}}};
</script>
<style>
/* Layout: mobile-first — content column + mini player + bottom tabs; from 768px: fixed sidebar, content, full-width player bar. Single deliberate dark theme. */
:root{
  --bg:#0e0d12; --surface:#16141c; --elev:#221f2a; --line:#2e2a38;
  --fg:#f4f2f8; --muted:#a49eb0; --accent:#ff4f7b;
  --tabs:62px; --mini:64px; --bar:92px; --side:248px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Shell */
#side{display:none}
#main{padding-bottom:calc(var(--tabs) + var(--mini) + 28px + env(safe-area-inset-bottom,0px))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 85%,transparent));display:grid;grid-template-columns:repeat(4,1fr)}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
body.dragging #main{outline:2px dashed var(--accent);outline-offset:-8px;border-radius:16px}
#mini{position:fixed;z-index:31;bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px) + 6px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px))}
#bar{display:none}
@media (min-width:768px){
  #side{display:flex;position:fixed;top:0;left:0;bottom:var(--bar);width:var(--side);padding-left:env(safe-area-inset-left,0px)}
  #main{margin-left:var(--side);padding-bottom:calc(var(--bar) + 32px)}
  #tabs,#mini{display:none}
  #bar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
    grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px}
}

/* Track rows */
.trow{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
@media (min-width:640px){.trow{grid-template-columns:28px 44px minmax(0,1fr) 110px auto 48px}.trow.mine{grid-template-columns:28px 44px minmax(0,1fr) 110px auto auto 48px}}
.trow:hover{background:var(--elev)}
.trow.is-on{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tnum{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:center}
.tdur{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
.favbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.favbtn:hover{color:var(--fg)}
.favbtn.is-fav{color:var(--accent)}
.favbtn svg{width:20px;height:20px}
@media (max-width:639px){.tdur{display:none}}

/* Equalizer marker */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* Ranges */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;cursor:pointer;
  background:linear-gradient(var(--fg),var(--fg)) 0/var(--p,0%) 100% no-repeat,var(--line)}
.rng:hover,.rng:active{background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--line)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
.rng::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
.rng.lg{height:6px}
.rng.lg::-webkit-slider-thumb{width:18px;height:18px}

.ico svg{width:22px;height:22px}
.hscroll{scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.card .pbtn{opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .pbtn,.card:focus-within .pbtn{opacity:1;transform:none}
@media (hover:none){.card .pbtn{opacity:1;transform:none}}

/* Now playing sheet */
#sheet{position:fixed;inset:0;z-index:50;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;
  background:linear-gradient(180deg,var(--tint,#3a2340) 0%,var(--bg) 78%)}
#sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}.eq i{animation:none;height:10px}.card .pbtn{transition:none}}
</style>
</head>
<body>
<div id="app" class="min-h-full">
  <!-- Sidebar (desktop) -->
  <aside id="side" class="flex-col gap-2 p-3 bg-bg">
    <div class="px-3 pt-4 pb-5 flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-accent grid place-items-center text-bg"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>
      <span class="font-display font-bold text-lg tracking-tight">Écho</span>
    </div>
    <nav class="flex flex-col gap-1" id="sideNav"></nav>
    <div class="mt-4 pt-4 border-t border-line px-3 flex-1 min-h-0 flex flex-col">
      <p class="text-[11px] uppercase tracking-[.14em] text-muted mb-3">Ambiances</p>
      <div id="sideGenres" class="flex flex-col gap-1 overflow-y-auto"></div>
    </div>
  </aside>

  <!-- Main -->
  <main id="main" class="gutter md:pr-8 md:pl-8 pt-5 md:pt-8"></main>

  <!-- Mini player (mobile) -->
  <div id="mini" class="rounded-xl bg-elev shadow-2xl shadow-black/50 overflow-hidden" role="button" tabindex="0" aria-label="Ouvrir le lecteur">
    <div class="flex items-center gap-3 p-2 pr-1">
      <img id="mCover" alt="" class="w-11 h-11 rounded-md object-cover">
      <div class="min-w-0 flex-1"><p id="mTitle" class="truncate font-semibold text-[15px]"></p><p id="mArtist" class="truncate text-sm text-muted"></p></div>
      <button id="mFav" class="favbtn" data-fav="" aria-label="Aimer"></button>
      <button id="mPlay" class="w-11 h-11 grid place-items-center ico" aria-label="Lecture"></button>
    </div>
    <div class="h-[3px] bg-line mx-2 mb-[2px] rounded"><div id="mProg" class="h-full bg-fg rounded" style="width:0%"></div></div>
  </div>

  <!-- Tabs (mobile) -->
  <nav id="tabs" class="gutter" aria-label="Navigation"></nav>

  <!-- Player bar (desktop) -->
  <footer id="bar" class="gutter bg-bg border-t border-line">
    <div class="flex items-center gap-3 min-w-0">
      <button id="bCoverBtn" class="shrink-0 rounded-md" aria-label="Ouvrir le lecteur en grand"><img id="bCover" alt="" class="w-14 h-14 rounded-md object-cover"></button>
      <div class="min-w-0"><p id="bTitle" class="truncate font-semibold"></p><p id="bArtist" class="truncate text-sm text-muted"></p></div>
      <button id="bFav" class="favbtn shrink-0" data-fav="" aria-label="Aimer"></button>
    </div>
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center gap-4">
        <button class="ctl-shuffle w-9 h-9 grid place-items-center text-muted hover:text-fg ico" aria-label="Lecture aléatoire" aria-pressed="false"></button>
        <button class="ctl-prev w-9 h-9 grid place-items-center text-fg ico" aria-label="Précédent"></button>
        <button id="bPlay" class="w-10 h-10 rounded-full bg-fg text-bg grid place-items-center hover:scale-105 transition ico" aria-label="Lecture"></button>
        <button class="ctl-next w-9 h-9 grid place-items-center text-fg ico" aria-label="Suivant"></button>
        <button class="ctl-repeat w-9 h-9 grid place-items-center text-muted hover:text-fg ico relative" aria-label="Répéter" aria-pressed="false"></button>
      </div>
      <div class="w-full max-w-xl flex items-center gap-2 text-xs text-muted tabular-nums">
        <span id="bCur" class="w-10 text-right">0:00</span>
        <input id="bSeek" class="rng" type="range" min="0" max="1000" value="0" aria-label="Position">
        <span id="bDur" class="w-10">0:00</span>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2">
      <span class="text-muted ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></span>
      <input id="bVol" class="rng max-w-[130px]" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <!-- Now playing sheet -->
  <section id="sheet" class="gutter" aria-label="En cours de lecture" aria-hidden="true">
    <div class="max-w-md mx-auto flex flex-col gap-5">
      <div class="flex items-center justify-between">
        <button id="sClose" class="w-10 h-10 grid place-items-center ico" aria-label="Fermer le lecteur"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.6 5.4 9l1.4-1.4 5.2 5.2 5.2-5.2L18.6 9z"/></svg></button>
        <div class="text-center"><p class="text-[11px] uppercase tracking-[.14em] text-muted">Lecture depuis</p><p id="sCtx" class="text-sm font-semibold"></p></div>
        <span class="w-10"></span>
      </div>
      <img id="sCover" alt="" class="w-full aspect-square max-w-full rounded-xl object-cover shadow-2xl shadow-black/60">
      <canvas id="viz" class="w-full h-12" aria-hidden="true"></canvas>
      <div class="flex items-center gap-3">
        <div class="min-w-0 flex-1"><h2 id="sTitle" class="font-display font-bold text-xl leading-tight truncate"></h2><p id="sArtist" class="text-muted truncate mt-1"></p></div>
        <button id="sFav" class="favbtn !w-11 !h-11" data-fav="" aria-label="Aimer"></button>
      </div>
      <div>
        <input id="sSeek" class="rng lg" type="range" min="0" max="1000" value="0" aria-label="Position">
        <div class="flex justify-between text-xs text-muted tabular-nums mt-2"><span id="sCur">0:00</span><span id="sDur">0:00</span></div>
      </div>
      <div class="flex items-center justify-between px-1">
        <button class="ctl-shuffle w-11 h-11 grid place-items-center text-muted ico" aria-label="Lecture aléatoire" aria-pressed="false"></button>
        <button class="ctl-prev w-12 h-12 grid place-items-center ico [&_svg]:!w-8 [&_svg]:!h-8" aria-label="Précédent"></button>
        <button id="sPlay" class="w-[72px] h-[72px] rounded-full bg-fg text-bg grid place-items-center ico [&_svg]:!w-8 [&_svg]:!h-8" aria-label="Lecture"></button>
        <button class="ctl-next w-12 h-12 grid place-items-center ico [&_svg]:!w-8 [&_svg]:!h-8" aria-label="Suivant"></button>
        <button class="ctl-repeat w-11 h-11 grid place-items-center text-muted ico relative" aria-label="Répéter" aria-pressed="false"></button>
      </div>
      <div class="flex items-center gap-3 text-muted">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="currentColor"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></svg>
        <input id="sVol" class="rng" type="range" min="0" max="100" value="80" aria-label="Volume">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </div>
      <p class="text-xs text-muted text-center">Les titres de démo sont générés en direct. Sur iPhone, coupe le mode silencieux si tu n'entends rien.</p>
    </div>
  </section>
  <input id="fileIn" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" multiple hidden>
  <div id="toast" role="status" hidden></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (!isFinite(s)) return '–:––'; s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

/* ---------------- Catalogue (fictional) ---------------- */
const PROGS = {
  a:[[0,3,7,10],[8,12,15,19],[3,7,10,14],[10,14,17,21]],
  b:[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]],
  c:[[0,3,7,10],[5,8,12,15],[8,12,15,19],[7,10,14,17]],
  d:[[0,4,7,11],[5,9,12,16],[2,5,9,12],[7,11,14,17]]
};
const GENRES = {
  synthwave:{label:'Synthwave', desc:'Néons, arpèges et routes de nuit'},
  lofi:{label:'Lo-fi', desc:'Beats feutrés pour se concentrer'},
  ambient:{label:'Ambient', desc:'Nappes lentes, temps suspendu'},
  house:{label:'House', desc:'Quatre temps pour bouger'},
  chill:{label:'Chill', desc:'Douceur de fin de journée'}
};
const RAW = [
  [1,'Néons sur la Garonne','Lumen Atlas','synthwave',100,45,'a',150,[322,262]],
  [2,'Café crème, 7 h 12','Mira Vélo','lofi',78,41,'d',130,[28,352]],
  [3,'Marée basse','Les Phares','ambient',68,40,'b',160,[192,228]],
  [4,'Ligne 14','KAZA','house',122,43,'c',140,[48,282]],
  [5,"Poussière d'or",'Nova Ruelle','chill',92,46,'b',135,[40,12]],
  [6,'Après la pluie','Mira Vélo','lofi',82,38,'a',125,[208,168]],
  [7,'Station orbitale','Lumen Atlas','synthwave',108,40,'c',145,[278,200]],
  [8,'Brume de novembre','Les Phares','ambient',62,36,'d',170,[248,206]],
  [9,'Toit-terrasse','KAZA','house',124,45,'b',150,[8,330]],
  [10,'Velours','Sœur Cosmos','chill',96,42,'a',140,[300,340]],
  [11,'Le dernier métro','Nova Ruelle','lofi',74,43,'c',130,[230,288]],
  [12,'Hologramme','Sœur Cosmos','synthwave',112,47,'d',155,[182,300]]
];
const TRACKS = RAW.map(([id,title,artist,style,bpm,root,prog,target,hues]) => {
  const sd = 60/bpm/4;
  const bars = Math.max(8, Math.round(target*bpm/240/4)*4);
  return {id,title,artist,style,bpm,root,prog:PROGS[prog],hues,sd,bars,steps:bars*16,duration:bars*16*sd};
});
const DEMO = TRACKS.slice();
const byId = id => TRACKS.find(t => t.id === id);
const gl = t => t.file ? 'Ma musique' : GENRES[t.style].label;
const hashHue = s => [...s].reduce((h,c) => (h*31 + c.charCodeAt(0)) >>> 0, 7) % 360;

/* ---------------- Generated covers ---------------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function makeCover(t){
  const S = 320, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), R = rng(t.id*7919), [h1,h2] = t.hues;
  const grd = g.createLinearGradient(0,0,S,S);
  grd.addColorStop(0,`hsl(${h1} 72% 46%)`); grd.addColorStop(1,`hsl(${h2} 62% 14%)`);
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  if (t.style === 'synthwave'){
    const sc = document.createElement('canvas'); sc.width = sc.height = S; const s = sc.getContext('2d');
    const sg = s.createLinearGradient(0,70,0,250); sg.addColorStop(0,'#ffd36b'); sg.addColorStop(1,`hsl(${h1} 95% 60%)`);
    s.fillStyle = sg; s.beginPath(); s.arc(160,170,95,0,Math.PI*2); s.fill();
    s.globalCompositeOperation = 'destination-out';
    for (let i=0;i<6;i++) s.fillRect(0,178+i*14,S,3+i*1.6);
    g.drawImage(sc,0,0);
    g.fillStyle = `hsl(${h2} 60% 10%)`; g.fillRect(0,230,S,90);
    g.strokeStyle = `hsla(${h1} 100% 70% / .6)`; g.lineWidth = 1.5;
    for (let x=-9;x<=9;x++){ g.beginPath(); g.moveTo(160+x*9,230); g.lineTo(160+x*48,S); g.stroke(); }
    for (let i=1;i<8;i++){ const y = 230 + i*i*1.6; g.beginPath(); g.moveTo(0,y); g.lineTo(S,y); g.stroke(); }
  } else if (t.style === 'lofi'){
    for (let i=0;i<7;i++){ g.fillStyle = `hsla(${h1 + R()*60 - 30} 80% ${55+R()*20}% / ${.18+R()*.25})`;
      g.beginPath(); g.arc(R()*S, R()*S, 30+R()*90, 0, Math.PI*2); g.fill(); }
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(70,60,180,200);
    g.fillStyle = `hsla(${h1} 90% 75% / .55)`; g.fillRect(84,74,72,86); g.fillRect(164,74,72,86); g.fillRect(84,168,152,78);
  } else if (t.style === 'ambient'){
    for (let b=0;b<9;b++){ g.beginPath(); const y0 = 40 + b*32, a = 6 + R()*16, f = .01 + R()*.02, ph = R()*6;
      g.moveTo(0,S); for (let x=0;x<=S;x+=8) g.lineTo(x, y0 + Math.sin(x*f+ph)*a); g.lineTo(S,S); g.closePath();
      g.fillStyle = `hsla(${h1 + b*6} 60% ${70 - b*6}% / .16)`; g.fill(); }
  } else if (t.style === 'house'){
    g.lineWidth = 9; const cx = 100+R()*120, cy = 100+R()*120;
    for (let r=20;r<420;r+=26){ g.strokeStyle = `hsla(${r%52===20?h1:h2+40} 90% 62% / ${Math.max(.08,.7 - r/600)})`; g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke(); }
  } else if (t.style === 'mine'){
    g.lineWidth = 2;
    for (let r=30;r<260;r+=12){ g.strokeStyle = `hsla(${h1} 80% 78% / ${.05 + R()*.14})`; g.beginPath(); g.arc(160,160,r,0,Math.PI*2); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,.38)'; g.beginPath(); g.arc(160,160,72,0,Math.PI*2); g.fill();
    g.fillStyle = `hsl(${h1} 85% 74%)`; g.font = '700 64px Unbounded, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(([...t.title.trim()][0] || '♪').toUpperCase(), 160, 166);
  } else {
    g.filter = 'blur(28px)';
    for (let i=0;i<5;i++){ g.fillStyle = `hsla(${h1 + i*25} 85% 62% / .55)`; g.beginPath(); g.arc(40+R()*240, 40+R()*240, 50+R()*70, 0, Math.PI*2); g.fill(); }
    g.filter = 'none';
  }
  for (let i=0;i<1800;i++){ g.fillStyle = `rgba(255,255,255,${R()*.05})`; g.fillRect(R()*S, R()*S, 1, 1); }
  return c.toDataURL('image/jpeg', .86);
}
const COV = {}; TRACKS.forEach(t => COV[t.id] = makeCover(t));

/* ---------------- Icons ---------------- */
const P = d => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON = {
  play:P('M8 5.1v13.8a1 1 0 0 0 1.5.9l10.8-6.9a1 1 0 0 0 0-1.7L9.5 4.2A1 1 0 0 0 8 5.1z'),

function ctxIds(key){
  if (key === 'favs') return TRACKS.filter(t => S.favs.has(t.id)).map(t => t.id);
  if (key === 'fresh') return DEMO.slice(-6).reverse().map(t => t.id);
  if (key === 'mine') return TRACKS.filter(t => t.file).map(t => t.id);
  if (key === 'search') return searchResults().map(t => t.id);
  if (key.startsWith('genre:')) { const g = key.slice(6); return TRACKS.filter(t => t.style === g).map(t => t.id); }
  return TRACKS.map(t => t.id);
}
function ctxLabel(key){
  if (key === 'favs') return 'Titres likés';
  if (key === 'fresh') return 'Sorties fraîches';
  if (key === 'mine') return 'Ma musique';
  if (key === 'search') return 'Recherche';
  if (key.startsWith('genre:')) return GENRES[key.slice(6)].label;
  return 'Tous les titres';
}
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function searchResults(){
  const q = norm(S.query.trim()); if (!q) return [];
  return TRACKS.filter(t => norm(t.title + ' ' + t.artist + ' ' + gl(t)).includes(q));
}

/* ---------------- Audio engine (Web Audio synth) ---------------- */
const E = { ctx:null, master:null, analyser:null, bus:null, timer:null, t0:0, offset:0, next:0, playing:false, noise:null };
const mtof = m => 440 * Math.pow(2, (m-69)/12);
function initAudio(){
  if (E.ctx) return true;
  try {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    E.ctx = ctx;
    E.master = ctx.createGain(); E.master.gain.value = S.vol;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    E.analyser = ctx.createAnalyser(); E.analyser.fftSize = 256; E.analyser.smoothingTimeConstant = .82;
    E.master.connect(comp).connect(E.analyser).connect(ctx.destination);
    try { ctx.createMediaElementSource(AU).connect(E.master); E.routed = true; AU.volume = 1; } catch(e){}
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    E.noise = nb;
    return true;
  } catch(e){ return false; }
}
function tone(out, m, t, len, o){
  const ctx = E.ctx, osc = ctx.createOscillator(), g = ctx.createGain(), a = o.attack || .005;
  osc.type = o.type || 'sine'; osc.frequency.value = mtof(m); if (o.detune) osc.detune.value = o.detune;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.gain, t + a);
  g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(len, a + .03));
  let n = osc;
  if (o.cutoff){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.cutoff; f.Q.value = o.q || .7; osc.connect(f); n = f; }
  n.connect(g); g.connect(out); osc.start(t); osc.stop(t + Math.max(len, a) + .1);
}
function kick(out, t, v){
  const ctx = E.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .32);
  o.connect(g).connect(out); o.start(t); o.stop(t + .35);
}
function noiseHit(out, t, v, len, type, freq){
  const ctx = E.ctx, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = E.noise; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
  s.connect(f).connect(g).connect(out); s.start(t, Math.random()*.5); s.stop(t + len + .05);
}
const hat = (out,t,v,open) => noiseHit(out, t, v, open ? .18 : .05, 'highpass', 7500);
const snare = (out,t,v) => { noiseHit(out, t, v, .2, 'bandpass', 1900); tone(out, 55, t, .1, {type:'triangle', gain:v*.5}); };
const chord = (out, notes, t, len, o) => notes.forEach((n,i) => tone(out, n, t, len, {...o, detune:(i%2?7:-7)}));

function schedule(tr, s, t, out){
  const bar = Math.floor(s/16), st = s % 16, sd = tr.sd, ch = tr.prog[bar % tr.prog.length];
  const r = rng(tr.id*100003 + s)(), R0 = tr.root, intro = bar < 2, brk = bar % 8 === 7;
  if (s === tr.steps - 32){ out.gain.setValueAtTime(1, t); out.gain.linearRampToValueAtTime(.0001, t + 32*sd); }
  const arp = [0,1,2,3,2,1,0,2];
  switch (tr.style){
    case 'synthwave':
      if (st === 0) chord(out, ch.map(c => R0+12+c), t, 16*sd, {type:'sawtooth', gain:.035, cutoff:1300, attack:.08});
      if (!intro && st % 2 === 0) tone(out, R0 + ch[0] - 12, t, sd*1.7, {type:'sawtooth', gain:.13, cutoff:520});
      tone(out, R0 + 24 + ch[arp[st%8]] + (st >= 8 ? 12 : 0), t, sd*.9, {type:'square', gain:.032, cutoff:2400});
      if (!intro){ if (!brk && st % 8 === 0) kick(out, t, .9); if (st === 4 || st === 12) snare(out, t, .32); if (st % 2 === 0) hat(out, t, .05); }
      break;
    case 'house':
      if (!intro && !brk && st % 4 === 0) kick(out, t, 1);
      if (!intro && (st === 4 || st === 12)) snare(out, t, .28);
      if (st % 4 === 2) hat(out, t, .08, true); else if (!intro) hat(out, t, .025);
      if (!intro && st % 4 === 2) tone(out, R0 + ch[0] - 12, t, sd*1.5, {type:'sawtooth', gain:.15, cutoff:480, q:4});
      if ((st === 3 || st === 10) && r > .25) chord(out, ch.map(c => R0+12+c), t, sd*1.6, {type:'square', gain:.026, cutoff:1900});
      break;
    case 'lofi': {
      const sw = st % 4 === 2 ? sd*.28 : 0;
      if (st === 0 || (st === 10 && r < .6)) chord(out, ch.map(c => R0+12+c), t, sd*7, {type:'triangle', gain:.06, cutoff:1100, attack:.015});
      if (!intro && (st === 0 || st === 10 || (st === 7 && r < .5))) tone(out, R0 + ch[0] - 12, t, sd*3, {type:'sine', gain:.3});
      if (!intro){ if (st === 0 || st === 10 || (st === 7 && r < .35)) kick(out, t, .7); if (st === 4 || st === 12) snare(out, t + sw, .22); }
      if (st % 2 === 0) hat(out, t + sw, .03);
      if (st % 2 === 0 && r > .84) tone(out, R0 + 24 + [0,3,5,7,10][Math.floor(r*37)%5], t + sw, sd*2.5, {type:'triangle', gain:.05});
      break; }
    case 'ambient':
      if (st === 0){
        chord(out, ch.map(c => R0+12+c), t, 16*sd + 1.6, {type:'sine', gain:.06, attack:1.4});
        chord(out, ch.slice(0,3).map(c => R0+24+c), t, 16*sd + 1.6, {type:'triangle', gain:.018, attack:1.8, cutoff:1400});
        tone(out, R0 + ch[0] - 12, t, 16*sd, {type:'sine', gain:.16, attack:.6});
      }
      if (st % 2 === 0 && r > .74) tone(out, R0 + 24 + ch[Math.floor(r*40)%4] + (r > .92 ? 12 : 0), t, 2.6, {type:'sine', gain:.06});
      break;
    default: // chill
      if (st === 0) chord(out, ch.map(c => R0+12+c), t, 16*sd, {type:'triangle', gain:.035, cutoff:1500, attack:.2});
      if (st % 2 === 0) tone(out, R0 + 12 + ch[arp[(st/2)%8]] + (bar%2 ? 12 : 0), t, sd*3, {type:'triangle', gain:.055});
      if (!intro && (st === 0 || st === 6 || st === 10)) tone(out, R0 + ch[0] - 12, t, sd*2.5, {type:'sine', gain:.26});
      if (!intro){ if (st === 0 || st === 10 || (st === 6 && r < .5)) kick(out, t, .75); if (st === 4 || st === 12) snare(out, t, .2); hat(out, t, .018); }
  }
}
const AU = new Audio(); AU.preload = 'auto'; AU.setAttribute('playsinline', '');
const isFile = t => !!(t && t.url);
const durOf = t => t && t.duration > 0 && isFinite(t.duration) ? t.duration
  : (isFile(t) && AU.dataset.id == t.id && isFinite(AU.duration) ? AU.duration : NaN);
function pos(){
  const tr = byId(S.cur);
  if (isFile(tr)) return AU.dataset.id == tr.id ? AU.currentTime : E.offset;
  return E.playing ? Math.max(E.offset, E.offset + E.ctx.currentTime - E.t0) : E.offset;
}
function tick(){
  const tr = byId(S.cur), ctx = E.ctx, ahead = document.hidden ? 1.6 : .15;
  while (E.next < tr.steps){
    const t = E.t0 + E.next*tr.sd - E.offset;
    if (t > ctx.currentTime + ahead) break;
    if (t >= ctx.currentTime - .02) schedule(tr, E.next, t, E.bus);
    E.next++;
  }
  if (pos() >= tr.duration) onEnded();
}
function halt(){
  clearInterval(E.timer); E.timer = null;
  if (E.bus){ const b = E.bus; b.gain.cancelScheduledValues(E.ctx.currentTime); b.gain.setTargetAtTime(0, E.ctx.currentTime, .02); setTimeout(() => b.disconnect(), 400); E.bus = null; }
  if (!AU.paused) AU.pause();
  E.playing = false;
}
function startEngine(){
  const tr = byId(S.cur); if (!tr) return;
  const ok = initAudio();
  halt();
  if (isFile(tr)){
    if (E.ctx) E.ctx.resume();
    if (AU.dataset.id != tr.id){ AU.src = tr.url; AU.dataset.id = tr.id; }
    const off = E.offset;
    if (off > 0){ if (AU.readyState >= 1) AU.currentTime = off; else AU.addEventListener('loadedmetadata', () => { AU.currentTime = off; }, {once:true}); }
    else if (AU.readyState >= 1 && AU.currentTime > 0) AU.currentTime = 0;
    E.playing = true;
    const p = AU.play(); if (p) p.catch(() => { E.playing = false; toast("Ce fichier ne peut pas être lu sur cet appareil."); refresh(); });
  } else {
    if (!ok) return;
    E.ctx.resume();
    if (E.offset >= tr.duration) E.offset = 0;
    E.bus = E.ctx.createGain(); E.bus.connect(E.master);
    E.t0 = E.ctx.currentTime + .06;
    E.next = Math.ceil(E.offset / tr.sd - 1e-6);
    E.playing = true;
    tick(); E.timer = setInterval(tick, 25);
  }
  updateMedia(); refresh();
}
function stopEngine(){
  if (!E.playing) return;
  E.offset = pos(); halt(); updateMedia(); refresh();
}
const togglePlay = () => E.playing ? stopEngine() : startEngine();
function playTrack(id, ctx){
  S.cur = id; if (ctx) S.ctx = ctx; E.offset = 0;
  startEngine(); updateNow();
}
function seekTo(sec){
  const tr = byId(S.cur), d = durOf(tr); if (!isFinite(d)) return;
  E.offset = Math.min(Math.max(0, sec), d - .1);
  if (isFile(tr) && AU.dataset.id == tr.id){ AU.currentTime = E.offset; return; }
  if (E.playing) startEngine();
}
AU.addEventListener('ended', () => { if (E.playing && isFile(byId(S.cur))) onEnded(); });
AU.addEventListener('pause', () => { if (E.playing && AU.paused && isFile(byId(S.cur))){ E.offset = AU.currentTime; E.playing = false; updateMedia(); refresh(); } });
AU.addEventListener('loadedmetadata', () => {
  const t = byId(+AU.dataset.id);
  if (isFile(t) && !(t.duration > 0) && isFinite(AU.duration)){ t.duration = t.rec.duration = AU.duration; DB.put(t.rec).catch(() => {}); refresh(); }
});
function nextId(dir){
  let ids = ctxIds(S.ctx); if (!ids.length) ids = TRACKS.map(t => t.id);
  const i = ids.indexOf(S.cur);
  if (S.shuffle && ids.length > 1){ let n; do n = ids[Math.floor(Math.random()*ids.length)]; while (n === S.cur); return n; }
  if (i < 0) return ids[0];
  const j = i + dir;
  if (j >= ids.length) return S.repeat === 'all' || dir > 0 && S.repeat !== 'stop' ? ids[0] : null;
  if (j < 0) return ids[ids.length-1];
  return ids[j];
}
function next(){ const was = E.playing; S.cur = nextId(1); E.offset = 0; was ? startEngine() : refresh(); updateNow(); }
function prev(){
  if (pos() > 3){ seekTo(0); refresh(); return; }
  const was = E.playing; S.cur = nextId(-1); E.offset = 0; was ? startEngine() : refresh(); updateNow();
}
function onEnded(){
  if (S.repeat === 'one'){ E.offset = 0; startEngine(); return; }
  const ids = ctxIds(S.ctx), last = ids.indexOf(S.cur) === ids.length - 1;
  if (last && S.repeat === 'off' && !S.shuffle){ halt(); E.offset = 0; if (isFile(byId(S.cur))) AU.currentTime = 0; updateMedia(); refresh(); return; }
  S.cur = nextId(1); E.offset = 0; startEngine(); updateNow();
}
function setVol(v){
  S.vol = v; store.set('echo-vol', v);
  if (E.master) E.master.gain.setTargetAtTime(v, E.ctx.currentTime, .02);
  if (!E.routed) AU.volume = v;
  ['bVol','sVol'].forEach(id => { const el = $(id); el.value = Math.round(v*100); el.style.setProperty('--p', (v*100)+'%'); });
}

/* ---------------- Media Session (lock screen) ---------------- */
function updateMedia(){
  if (!('mediaSession' in navigator)) return;
  try {
    const t = byId(S.cur);
    navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist, album:gl(t), artwork:[{src:COV[t.id], sizes:'320x320', type:'image/jpeg'}] });
    navigator.mediaSession.playbackState = E.playing ? 'playing' : 'paused';
  } catch(e){}
}
try {
  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', startEngine);
    navigator.mediaSession.setActionHandler('pause', () => stopEngine());
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  }
} catch(e){}

/* ---------------- Rendering ---------------- */
function row(t, i, ctx){
  const on = t.id === S.cur, fav = S.favs.has(t.id), mine = ctx === 'mine';
  return `<div class="trow ${mine ? 'mine' : ''} ${on ? 'is-on' : ''}" data-play="${t.id}" data-ctx="${ctx}" role="button" tabindex="0" aria-label="Lire ${esc(t.title)} de ${esc(t.artist)}">
    <span class="tnum">${on && E.playing ? EQ : i+1}</span>
    <img src="${COV[t.id]}" alt="" class="w-11 h-11 rounded-md object-cover">
    <span class="min-w-0"><span class="block truncate font-semibold ${on ? 'text-accent' : ''}">${esc(t.title)}</span><span class="block truncate text-sm text-muted">${esc(t.artist)}</span></span>
    <span class="hidden sm:block text-sm text-muted truncate">${gl(t)}</span>
    <button class="favbtn ${fav ? 'is-fav' : ''}" data-fav="${t.id}" aria-pressed="${fav}" aria-label="${fav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">${fav ? ICON.heartF : ICON.heart}</button>
    ${mine ? `<button class="favbtn" data-del="${t.id}" aria-label="Retirer ${esc(t.title)} de Ma musique">${ICON.trash}</button>` : ''}
    <span class="tdur">${fmt(durOf(t))}</span>
  </div>`;
}
const list = (tracks, ctx) => `<div class="flex flex-col">${tracks.map((t,i) => row(t,i,ctx)).join('')}</div>`;
const totalDur = ts => { const m = Math.round(ts.reduce((a,t) => { const d = durOf(t); return a + (isFinite(d) ? d : 0); }, 0)/60); return m + ' min'; };
const bigPlay = ctx => `<button class="w-14 h-14 rounded-full bg-accent text-bg grid place-items-center ico [&_svg]:!w-7 [&_svg]:!h-7 hover:scale-105 transition shadow-lg shadow-black/40" data-playctx="${ctx}" aria-label="Lire la sélection">${E.playing && S.ctx === ctx ? ICON.pause : ICON.play}</button>`;

function genreHeader(title, sub, img, tint, ctx, eyebrow){
  return `<header class="-mx-4 md:-mx-8 px-4 md:px-8 pt-4 pb-6 mb-2 rounded-b-2xl" style="background:linear-gradient(180deg,${tint},transparent)">
    <div class="flex flex-col sm:flex-row sm:items-end gap-5">
      ${img}
      <div class="min-w-0">
        <p class="text-[11px] uppercase tracking-[.14em] text-fg/80">${eyebrow}</p>
        <h1 class="font-display font-bold text-3xl md:text-5xl tracking-tight mt-1 [text-wrap:balance]">${esc(title)}</h1>
        <p class="text-muted mt-2">${sub}</p>
      </div>
    </div>
    <div class="mt-5">${bigPlay(ctx)}</div>
  </header>`;
}

function viewHome(){
  const h = new Date().getHours(), hello = h < 5 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  const tiles = [
    `<button data-nav="favs" class="flex items-center gap-3 bg-elev/70 hover:bg-elev rounded-lg overflow-hidden text-left pr-3 h-14 md:h-16">
       <span class="h-full aspect-square grid place-items-center text-white ico" style="background:linear-gradient(135deg,#7b3cff,#ff4f7b)">${ICON.heartF}</span>
       <span class="font-semibold text-sm truncate">Titres likés</span></button>`,
    ...Object.entries(GENRES).map(([k,g]) => { const t = TRACKS.find(x => x.style === k);
      return `<button data-genre="${k}" class="flex items-center gap-3 bg-elev/70 hover:bg-elev rounded-lg overflow-hidden text-left pr-3 h-14 md:h-16">
        <img src="${COV[t.id]}" alt="" class="h-full aspect-square object-cover"><span class="font-semibold text-sm truncate">${g.label}</span></button>`; })
  ].join('');
  const fresh = ctxIds('fresh').map(byId).map(t => `
    <div class="card shrink-0 w-[150px] md:w-[176px] p-2.5 rounded-xl hover:bg-elev transition group">
      <div class="relative">
        <img src="${COV[t.id]}" alt="" class="w-full aspect-square rounded-lg object-cover shadow-lg shadow-black/40">
        <button class="pbtn absolute right-2 bottom-2 w-11 h-11 rounded-full bg-accent text-bg grid place-items-center ico shadow-lg shadow-black/50" data-play="${t.id}" data-ctx="fresh" aria-label="Lire ${esc(t.title)}">${t.id === S.cur && E.playing ? ICON.pause : ICON.play}</button>
      </div>
      <p class="font-semibold mt-2.5 truncate">${esc(t.title)}</p>
      <p class="text-sm text-muted truncate">${esc(t.artist)}</p>
    </div>`).join('');
  return `
    <div class="flex items-center justify-between gap-3">
      <h1 class="font-display font-bold text-2xl md:text-3xl tracking-tight">${hello}</h1>
      ${installEvt ? `<button data-install class="h-10 px-4 rounded-full bg-accent text-bg font-semibold text-sm inline-flex items-center gap-2 [&_svg]:w-4 [&_svg]:h-4">${ICON.plus}Installer l'appli</button>` : ''}
    </div>

    ${(() => { const n = ctxIds('mine').length; return `<button data-nav="mine" class="mt-4 w-full flex items-center gap-4 p-4 rounded-xl text-left hover:brightness-110 transition" style="background:linear-gradient(120deg,#7a3a1f,#3a1d4f)">
      <span class="w-12 h-12 rounded-lg bg-black/25 grid place-items-center ico shrink-0">${ICON.note}</span>
      <span class="min-w-0"><span class="block font-semibold">${n ? 'Ma musique' : 'Ajoute tes propres musiques'}</span>
      <span class="block text-sm text-fg/75">${n ? n + ' titre' + (n > 1 ? 's' : '') + ' sur cet appareil' : 'Importe tes MP3 depuis ton téléphone ou ton ordinateur'}</span></span></button>`; })()}
    <section class="mt-9">
      <div class="flex items-baseline justify-between"><h2 class="font-display font-bold text-lg md:text-xl">Sorties fraîches</h2><span class="text-sm text-muted">${ctxIds('fresh').length} titres</span></div>
      <div class="hscroll flex gap-1 overflow-x-auto -mx-2 mt-3 pb-1">${fresh}</div>
    </section>
    <section class="mt-8">
      <div class="flex items-baseline justify-between mb-2"><h2 class="font-display font-bold text-lg md:text-xl">Tous les titres</h2><span class="text-sm text-muted">${TRACKS.length} titres · ${totalDur(TRACKS)}</span></div>
      ${list(TRACKS, 'all')}
    </section>`;
}
function viewGenre(){
  const g = GENRES[S.genre], ts = TRACKS.filter(t => t.style === S.genre), t0 = ts[0];
  const img = `<img src="${COV[t0.id]}" alt="" class="w-40 h-40 md:w-48 md:h-48 rounded-xl object-cover shadow-2xl shadow-black/50">`;
  return genreHeader(g.label, `${esc(g.desc)} · ${ts.length} titres · ${totalDur(ts)}`, img, `hsl(${t0.hues[0]} 55% 32%)`, 'genre:'+S.genre, 'Ambiance') + list(ts, 'genre:'+S.genre);
}
function viewFavs(){
  const ts = TRACKS.filter(t => S.favs.has(t.id));
  const img = `<div class="w-40 h-40 md:w-48 md:h-48 rounded-xl grid place-items-center text-white shadow-2xl shadow-black/50 [&_svg]:w-16 [&_svg]:h-16" style="background:linear-gradient(135deg,#7b3cff,#ff4f7b)">${ICON.heartF}</div>`;
  const body = ts.length ? list(ts, 'favs')
    : `<div class="text-center py-14 px-4"><p class="font-display font-bold text-lg">Aucun titre liké pour l'instant</p>
       <p class="text-muted mt-2 max-w-sm mx-auto">Touche le cœur à côté d'un morceau pour le retrouver ici.</p>
       <button data-nav="home" class="mt-5 px-5 h-11 rounded-full bg-fg text-bg font-semibold">Découvrir des titres</button></div>`;

}
function viewMine(){
  const ts = TRACKS.filter(t => t.file);

  const addBtn = `<button data-import class="h-11 px-5 rounded-full bg-fg text-bg font-semibold inline-flex items-center gap-2 [&_svg]:w-5 [&_svg]:h-5">${ICON.plus}Ajouter des fichiers</button>`;

    : `<div class="py-6 max-w-lg">${status}<p class="font-display font-bold text-lg">Ajoute tes propres morceaux</p>
        <p class="text-muted mt-2">Choisis des fichiers MP3, M4A, FLAC ou WAV. Ils sont lus et gardés dans ce navigateur. Rien n'est envoyé en ligne.</p>

          <li><b class="text-fg">iPhone</b> : tes fichiers doivent être dans l'app Fichiers (iCloud Drive ou « Sur mon iPhone »).</li>
          <li><b class="text-fg">Android</b> : ils peuvent venir de Téléchargements, de la carte SD ou de Google Drive.</li>
          <li><b class="text-fg">Ordinateur</b> : tu peux aussi les glisser directement sur la page.</li>
          <li>Les titres Apple Music, Spotify ou Deezer sont protégés et ne peuvent pas être importés.</li>

  return genreHeader('Ma musique', ts.length ? `${ts.length} titre${ts.length > 1 ? 's' : ''} · ${totalDur(ts)}` : 'Tes fichiers audio', img, '#7a3a1f', 'mine', 'Sur cet appareil') + body;
}
function viewSearch(){
  return `<h1 class="font-display font-bold text-2xl md:text-3xl tracking-tight">Rechercher</h1>
    <label class="relative block mt-5 max-w-xl">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-bg ico pointer-events-none">${ICON.search}</span>
      <input id="q" type="search" value="${esc(S.query)}" placeholder="Titre, artiste ou ambiance" autocomplete="off" enterkeyhint="search"
        class="w-full h-12 rounded-full bg-fg text-bg placeholder:text-bg/55 pl-12 pr-5 text-base font-medium outline-none focus:ring-2 focus:ring-accent">
    </label>
    <div id="results" class="mt-6"></div>`;
}
function renderResults(){
  const el = $('results'); if (!el) return;
  if (!S.query.trim()){
    el.innerHTML = `<h2 class="font-display font-bold text-lg mb-3">Parcourir les ambiances</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">${Object.entries(GENRES).map(([k,g]) => { const t = TRACKS.find(x => x.style === k);
        return `<button data-genre="${k}" class="relative overflow-hidden rounded-xl aspect-[4/3] text-left p-3 hover:brightness-110 transition" style="background:hsl(${t.hues[0]} 55% 36%)">
          <span class="font-display font-bold text-base relative z-10">${g.label}</span>
          <img src="${COV[t.id]}" alt="" class="absolute -right-3 -bottom-2 w-20 h-20 rounded-md rotate-[20deg] object-cover shadow-lg shadow-black/50"></button>`; }).join('')}</div>`;
    return;
  }
  const rs = searchResults();
  el.innerHTML = rs.length
    ? `<p class="text-sm text-muted mb-2">${rs.length} résultat${rs.length > 1 ? 's' : ''}</p>${list(rs, 'search')}`
    : `<div class="py-12 text-center"><p class="font-display font-bold text-lg">Aucun résultat pour « ${esc(S.query.trim())} »</p><p class="text-muted mt-2">Vérifie l'orthographe ou essaie un artiste, par exemple Mira Vélo.</p></div>`;
}

const NAV = [['home','Accueil',ICON.home],['search','Rechercher',ICON.search],['mine','Ma musique',ICON.note],['favs','Favoris',ICON.lib]];
function renderNav(){
  const active = k => S.view === k || (k === 'home' && S.view === 'genre');
  $('sideNav').innerHTML = NAV.map(([k,l,i]) => `<button data-nav="${k}" class="flex items-center gap-4 px-3 h-11 rounded-lg font-semibold ico ${active(k) ? 'text-fg bg-elev' : 'text-muted hover:text-fg'}" ${active(k) ? 'aria-current="page"' : ''}>${k === 'favs' && active(k) ? ICON.heartF : i}<span>${l}</span>${k === 'favs' ? `<span class="ml-auto text-xs text-muted tabular-nums">${S.favs.size}</span>` : ''}</button>`).join('');
  $('sideGenres').innerHTML = Object.entries(GENRES).map(([k,g]) => { const t = TRACKS.find(x => x.style === k);
    return `<button data-genre="${k}" class="flex items-center gap-3 p-1.5 -mx-1.5 rounded-lg text-left hover:bg-elev ${S.view === 'genre' && S.genre === k ? 'bg-elev' : ''}">
      <img src="${COV[t.id]}" alt="" class="w-10 h-10 rounded object-cover"><span class="min-w-0"><span class="block text-sm font-semibold truncate">${g.label}</span><span class="block text-xs text-muted truncate">${TRACKS.filter(x => x.style === k).length} titres</span></span></button>`; }).join('');
  $('tabs').innerHTML = NAV.map(([k,l,i]) => `<button data-nav="${k}" class="flex flex-col items-center justify-center gap-1 text-[11px] font-semibold ico ${active(k) ? 'text-fg' : 'text-muted'}" ${active(k) ? 'aria-current="page"' : ''}>${i}<span>${l}</span></button>`).join('');
}
function renderMain(){
  const m = $('main');
  m.innerHTML = S.view === 'genre' ? viewGenre() : S.view === 'favs' ? viewFavs() : S.view === 'mine' ? viewMine() : S.view === 'search' ? viewSearch() : viewHome();
  if (S.view === 'search'){ renderResults(); const q = $('q'); q.addEventListener('input', () => { S.query = q.value; renderResults(); }); }
}
function updateNow(){
  const t = byId(S.cur), fav = S.favs.has(t.id);
  [['mCover','mTitle','mArtist','mFav'],['bCover','bTitle','bArtist','bFav'],['sCover','sTitle','sArtist','sFav']].forEach(([c,ti,ar,f]) => {
    $(c).src = COV[t.id]; $(ti).textContent = t.title; $(ar).textContent = t.artist;
    const b = $(f); b.dataset.fav = t.id; b.innerHTML = fav ? ICON.heartF : ICON.heart; b.classList.toggle('is-fav', fav);
    b.setAttribute('aria-pressed', fav); b.setAttribute('aria-label', fav ? 'Retirer des favoris' : 'Ajouter aux favoris');
  });
  $('bDur').textContent = $('sDur').textContent = fmt(durOf(t));
  $('sCtx').textContent = ctxLabel(S.ctx);
  $('sheet').style.setProperty('--tint', `hsl(${t.hues[0]} 45% 26%)`);
  ['mPlay','bPlay','sPlay'].forEach(id => { $(id).innerHTML = E.playing ? ICON.pause : ICON.play; $(id).setAttribute('aria-label', E.playing ? 'Pause' : 'Lecture'); });
  document.querySelectorAll('.ctl-shuffle').forEach(b => { b.innerHTML = ICON.shuffle; b.setAttribute('aria-pressed', S.shuffle); b.style.color = S.shuffle ? 'var(--accent)' : ''; });
  document.querySelectorAll('.ctl-repeat').forEach(b => { b.innerHTML = ICON.repeat + (S.repeat === 'one' ? '<span class="absolute top-0.5 right-0.5 text-[9px] font-bold">1</span>' : '');
    b.setAttribute('aria-pressed', S.repeat !== 'off'); b.setAttribute('aria-label', {off:'Répéter : non', all:'Répéter : tout', one:'Répéter : ce titre'}[S.repeat]); b.style.color = S.repeat !== 'off' ? 'var(--accent)' : ''; });
  document.querySelectorAll('.ctl-prev').forEach(b => b.innerHTML = ICON.prev);
  document.querySelectorAll('.ctl-next').forEach(b => b.innerHTML = ICON.next);
  document.title = E.playing ? `${t.title} · ${t.artist}` : 'Écho Musique';
}
function refresh(){
  const sc = window.scrollY;
  if (S.view === 'search') renderResults(); else renderMain();
  renderNav(); updateNow();
  if (S.view !== 'search') window.scrollTo(0, sc);
}
function go(view, genre){
  S.view = view; S.genre = genre || null;
  renderMain(); renderNav(); window.scrollTo(0,0);
  if (view === 'search' && matchMedia('(hover:hover)').matches) $('q').focus();
}

/* ---------------- Interactions ---------------- */
function toggleFav(id){
  S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); saveFavs(); refresh();
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f){ e.stopPropagation(); toggleFav(+f.dataset.fav); return; }
  const dl = e.target.closest('[data-del]'); if (dl){ e.stopPropagation(); removeTrack(+dl.dataset.del); return; }
  if (e.target.closest('[data-import]')){ $('fileIn').click(); return; }
  if (e.target.closest('[data-install]') && installEvt){ const ev = installEvt; installEvt = null; ev.prompt(); ev.userChoice.finally(refresh); return; }
  const n = e.target.closest('[data-nav]'); if (n){ go(n.dataset.nav); return; }
  const g = e.target.closest('[data-genre]'); if (g){ go('genre', g.dataset.genre); return; }
  const pc = e.target.closest('[data-playctx]');
  if (pc){ const ctx = pc.dataset.playctx, ids = ctxIds(ctx); if (!ids.length) return;
    if (S.ctx === ctx && ids.includes(S.cur)) togglePlay(); else playTrack(S.shuffle ? ids[Math.floor(Math.random()*ids.length)] : ids[0], ctx); return; }
  const p = e.target.closest('[data-play]');
  if (p){ const id = +p.dataset.play; if (id === S.cur) togglePlay(); else playTrack(id, p.dataset.ctx); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-play][role=button]')){ e.preventDefault(); e.target.click(); return; }
  if (e.target.matches('button,[role=button]') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) seekTo(pos() + 10);
  else if (e.key === 'ArrowLeft' && e.shiftKey) seekTo(pos() - 10);
  else if (e.key === 'Escape') closeSheet();
});
$('mPlay').onclick = e => { e.stopPropagation(); togglePlay(); };
$('bPlay').onclick = togglePlay; $('sPlay').onclick = togglePlay;
document.querySelectorAll('.ctl-next').forEach(b => b.onclick = next);
document.querySelectorAll('.ctl-prev').forEach(b => b.onclick = prev);
document.querySelectorAll('.ctl-shuffle').forEach(b => b.onclick = () => { S.shuffle = !S.shuffle; updateNow(); });
document.querySelectorAll('.ctl-repeat').forEach(b => b.onclick = () => { S.repeat = {off:'all', all:'one', one:'off'}[S.repeat]; updateNow(); });

const sheet = $('sheet');
function openSheet(){ sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false'); setTimeout(() => $('sClose').focus(), 50); }
function closeSheet(){ if (!sheet.classList.contains('open')) return; sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); }
$('mini').addEventListener('click', e => { if (!e.target.closest('button')) openSheet(); });
$('mini').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === $('mini')){ e.preventDefault(); openSheet(); } });
$('bCoverBtn').onclick = openSheet; $('sClose').onclick = closeSheet;
let ty = null;
sheet.addEventListener('touchstart', e => { ty = sheet.scrollTop <= 0 && !e.target.closest('input') ? e.touches[0].clientY : null; }, {passive:true});
sheet.addEventListener('touchend', e => { if (ty !== null && e.changedTouches[0].clientY - ty > 90) closeSheet(); ty = null; });

let dragging = false;
['bSeek','sSeek'].forEach(id => {
  const el = $(id);
  el.addEventListener('input', () => { dragging = true; el.style.setProperty('--p', el.value/10 + '%');
    const s = el.value/1000*durOf(byId(S.cur)); $('bCur').textContent = $('sCur').textContent = fmt(s); });
  el.addEventListener('change', () => { seekTo(el.value/1000*durOf(byId(S.cur))); dragging = false; });
});
['bVol','sVol'].forEach(id => $(id).addEventListener('input', e => setVol(e.target.value/100)));

/* ---------------- Frame loop: progress + visualizer ---------------- */
const cv = $('viz'), g2 = cv.getContext('2d'); let fdata = null;
function frame(){
  const tr = byId(S.cur), d = durOf(tr), p = pos(), frac = isFinite(d) && d > 0 ? Math.min(1, p / d) : 0;
  if (!dragging){
    ['bSeek','sSeek'].forEach(id => { const el = $(id); el.value = frac*1000; el.style.setProperty('--p', frac*100 + '%'); });
    $('bCur').textContent = $('sCur').textContent = fmt(p);
  }
  $('mProg').style.width = frac*100 + '%';
  if (sheet.classList.contains('open')){
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
    g2.setTransform(dpr,0,0,dpr,0,0); g2.clearRect(0,0,W,H);
    const bars = Math.floor(W/7), bw = W/bars, live = E.playing && E.analyser;
    if (live){ fdata = fdata || new Uint8Array(E.analyser.frequencyBinCount); E.analyser.getByteFrequencyData(fdata); }
    for (let i=0;i<bars;i++){
      const v = live ? fdata[Math.floor(Math.pow(i/bars,1.5)*fdata.length*.8)]/255 : .06;
      const h = Math.max(2, v*H);
      g2.fillStyle = live ? `rgba(255,79,123,${.35 + v*.65})` : 'rgba(244,242,248,.18)';
      g2.fillRect(i*bw + 1, (H-h)/2, bw - 2, h);
    }
  }
  requestAnimationFrame(frame);
}

/* ---------------- My music: import + storage (IndexedDB, this device only) ---------------- */
const DB = (() => {
  let p;
  const open = () => p = p || new Promise((res, rej) => {
    const r = indexedDB.open('echo-musique', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('songs', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('songs', mode), req = fn(t.objectStore('songs'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return { all:() => tx('readonly', s => s.getAll()), put:v => tx('readwrite', s => s.put(v)), del:id => tx('readwrite', s => s.delete(id)) };
})();
let importing = 0, toastT;
function toast(msg){ const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3800); }
function addFileTrack(rec){
  const h = hashHue(rec.title + rec.artist);
  const t = { id:rec.id, title:rec.title, artist:rec.artist, style:'mine', file:true, url:URL.createObjectURL(rec.blob), duration:rec.duration, hues:[h, (h + 50) % 360], rec };
  COV[t.id] = makeCover(t); TRACKS.push(t);
  return t;
}
function probe(t){
  const a = new Audio(); a.preload = 'metadata';
  a.onloadedmetadata = () => { if (isFinite(a.duration) && a.duration > 0){ t.duration = t.rec.duration = a.duration; DB.put(t.rec).catch(() => {}); refresh(); } a.removeAttribute('src'); };
  a.src = t.url;
}
async function importFiles(files){
  const audio = [...files].filter(f => (f.type || '').startsWith('audio/') || /\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name));
  if (!audio.length){ toast('Aucun fichier audio reconnu (MP3, M4A, AAC, FLAC, WAV, OGG).'); return; }
  importing = audio.length; go('mine');
  const base = Date.now(); let saved = 0;
  for (const [i, f] of audio.entries()){
    const name = f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
    const parts = name.split(/\s+[-–]\s+/);
    const title = (parts.length > 1 ? parts.slice(1).join(' - ') : name).replace(/^\d{1,3}[\s.\-]+/, '') || name;
    const rec = { id:base + i, title, artist:parts.length > 1 ? parts[0] : 'Artiste inconnu', blob:f, duration:NaN, added:base + i };
    const t = addFileTrack(rec);
    try { await DB.put(rec); saved++; } catch(e){}
    probe(t);
  }
  importing = 0; refresh();
  const n = audio.length, s = n > 1 ? 's' : '';
  toast(saved === n ? `${n} titre${s} ajouté${s}` : `${n} titre${s} ajouté${s}, mais la mémoire du navigateur est pleine ou bloquée : ils disparaîtront à la fermeture.`);
}
async function removeTrack(id){
  const i = TRACKS.findIndex(t => t.id === id); if (i < 0) return;
  const t = TRACKS[i];
  if (S.cur === id){ halt(); AU.removeAttribute('src'); AU.dataset.id = ''; AU.load(); E.offset = 0; S.cur = DEMO[0].id; S.ctx = 'all'; updateMedia(); }
  TRACKS.splice(i, 1); URL.revokeObjectURL(t.url); delete COV[id];
  if (S.favs.delete(id)) saveFavs();
  try { await DB.del(id); } catch(e){}
  refresh(); toast('Retiré de Ma musique. Le fichier d\'origine reste sur ton appareil.');
}
$('fileIn').addEventListener('change', e => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; });
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { if ([...(e.dataTransfer?.types || [])].includes('Files')){ e.preventDefault(); document.body.classList.add('dragging'); } }));
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files); });

/* ---------------- Boot ---------------- */
setVol(S.vol); renderMain(); renderNav(); updateNow(); updateMedia(); requestAnimationFrame(frame);
try { DB.all().then(rs => { (rs || []).sort((a,b) => a.added - b.added).forEach(addFileTrack); if (rs && rs.length) refresh(); }).catch(() => {}); } catch(e){}
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
