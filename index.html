<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Écho Musique : lecteur de musique hors ligne pour tes fichiers audio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Écho Musique</title>
<meta name="theme-color" content="#170c1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink:'var(--ink)', fg:'var(--fg)', muted:'var(--muted)', faint:'var(--faint)', accent:'var(--accent)', accent2:'var(--accent2)' },
  fontFamily: { display:['Syne','Outfit','system-ui','sans-serif'], sans:['Outfit','system-ui','-apple-system','Segoe UI','sans-serif'] }
}}};
</script>
<style>
/* Layout: a floating glass shell over a living, colour-shifting backdrop.
   Mobile: content column, a mini-player card stacked on a floating rounded dock. From 900px: floating glass rail on the left, player capsule at the bottom.
   One deliberate night theme: warm plum ink, apricot → magenta light. */
:root{
  --ink:#170c1d; --ink2:#2a1233;
  --glass:rgba(255,236,240,.065); --glass2:rgba(255,236,240,.12); --stroke:rgba(255,226,236,.14);
  --fg:#fff3ee; --muted:rgba(255,232,226,.68); --faint:rgba(255,232,226,.44);
  --accent:#ff8a5c; --accent2:#ff3d8b; --accent3:#8a5cff; --on-accent:#1c0b12;
  --amb1:#ff8a5c; --amb2:#ff3d8b; --amb3:#8a5cff;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.2,.8,.2,1);
  --dock:66px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100%}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.font-display{letter-spacing:-.015em}
button{cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:14px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.sec-h{font-family:Syne,Outfit,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}

/* Living backdrop */
#amb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,var(--ink2),var(--ink) 72%)}
.blob{position:absolute;width:85vmax;height:85vmax;border-radius:50%;background:radial-gradient(circle at center,currentColor 0%,transparent 62%);transition:color 1.6s ease;will-change:transform}
.b1{color:var(--amb1);left:-34vmax;top:-38vmax;opacity:.42;animation:drift1 22s ease-in-out infinite alternate}
.b2{color:var(--amb2);right:-40vmax;top:8vh;opacity:.3;animation:drift2 27s ease-in-out infinite alternate}
.b3{color:var(--amb3);left:-14vmax;bottom:-50vmax;opacity:.36;animation:drift3 31s ease-in-out infinite alternate}
#halo{position:absolute;left:50%;bottom:-34vmax;width:96vmax;height:64vmax;margin-left:-48vmax;border-radius:50%;background:radial-gradient(closest-side,currentColor,transparent);color:var(--amb1);opacity:.2;transition:color 1.6s ease,transform .8s var(--out),opacity .8s var(--out);will-change:transform,opacity}
body.is-playing #halo{transition:color 1.6s ease}
.grain{position:absolute;inset:0;opacity:.06;background-size:180px}
@keyframes drift1{to{transform:translate3d(14vmax,12vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-12vmax,16vmax,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(16vmax,-10vmax,0) scale(1.1)}}

/* Glass */
.glass{background:linear-gradient(160deg,rgba(255,240,245,.13),rgba(255,240,245,.045));border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 20px 44px -18px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.14)}
.pane{background:linear-gradient(160deg,rgba(255,240,245,.095),rgba(255,240,245,.03));border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px -22px rgba(0,0,0,.85)}

/* Shell */
#app{position:relative;z-index:1;min-height:100%}
#main{padding-top:18px;padding-bottom:calc(var(--dock) + 120px + env(safe-area-inset-bottom,0px));transform-origin:50% 20%;transition:transform .5s var(--out),opacity .5s var(--out)}
#dockWrap{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transition:transform .5s var(--out),opacity .5s var(--out)}
body.player-open #main,body.player-open #dockWrap,body.player-open #rail{transform:scale(.93);opacity:.3}
#dock{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);height:var(--dock);border-radius:999px;padding:6px}
#dockBlob{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:999px;background:linear-gradient(135deg,#ffb07a,var(--accent) 35%,var(--accent2));
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent2) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.45);transform:translateX(calc(var(--i,0) * 100%));transition:transform .55s var(--spring)}
#dock button{position:relative;overflow:hidden;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:999px}
#dock button[aria-current]{color:var(--on-accent)}
#dock svg{width:22px;height:22px;transition:transform .45s var(--spring)}
#dock button[aria-current] svg{transform:translateY(-1px) scale(1.08)}
#mini{position:relative;z-index:1;margin:0 12px -28px;padding:12px 10px 38px;border-radius:28px 28px 20px 20px;cursor:pointer}
.mprog{position:absolute;left:24px;right:24px;top:0;height:2px;border-radius:2px;background:rgba(255,236,240,.14);overflow:hidden}
#mProg{height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent2));will-change:transform}
.disc-wrap{position:relative;flex:none}
.disc{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.14),0 6px 14px -4px rgba(0,0,0,.7);animation:spin 10s linear infinite;animation-play-state:paused}
body.is-playing .disc{animation-play-state:running}
.disc-wrap::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.desk{display:none!important}
#rail{display:none}
@media (min-width:900px){
  #rail{display:flex;position:fixed;z-index:20;top:16px;bottom:16px;left:16px;width:256px;border-radius:30px;flex-direction:column;padding:20px 14px;transition:transform .5s var(--out),opacity .5s var(--out)}
  #main{margin-left:288px;padding-left:28px;padding-right:32px;padding-top:30px;padding-bottom:150px}
  #dock{display:none}
  #dockWrap{left:304px;right:24px;bottom:16px}
  #mini{margin:0;padding:12px 16px;border-radius:26px}
  .mprog{top:auto;bottom:0}
  .desk{display:grid!important}
}

/* Buttons: springy press on everything touchable */
button,[role=button],.tap{transition:transform .45s var(--spring),background-color .2s,color .2s,box-shadow .25s,opacity .2s,filter .2s}
button:active:not(:disabled),[role=button]:active,.tap:active{transform:scale(.93);transition-duration:.09s}
.trow:active,#mini:active,.resume:active,.top-row:active{transform:scale(.98)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;color:var(--muted);flex:none}
.ib:hover{color:var(--fg);background:var(--glass)}
.ib svg{width:21px;height:21px}
.ib.is-fav{color:var(--accent2)}
.ib.is-on{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.glass-ib{background:var(--glass2);border:1px solid var(--stroke);color:var(--fg)}
.hp{position:relative;color:var(--on-accent);background:linear-gradient(145deg,#ffc08a 0%,var(--accent) 40%,var(--accent2) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -4px 9px rgba(120,0,50,.35),0 14px 30px -10px color-mix(in srgb,var(--accent2) 85%,transparent),0 3px 8px rgba(0,0,0,.45)}
.hp:hover{filter:brightness(1.06)}
.hp:active:not(:disabled){transform:scale(.88);box-shadow:inset 0 3px 9px rgba(120,0,50,.5),0 4px 12px -6px color-mix(in srgb,var(--accent2) 70%,transparent)}
.hp::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--accent2);opacity:0;pointer-events:none}
body.is-playing #pPlay::after{animation:ring 2.4s ease-out infinite}
.hp svg{width:26px;height:26px}
.pillbtn{height:46px;padding:0 20px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--stroke)}
.pillbtn svg{width:20px;height:20px}
.pill{height:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;position:relative;overflow:hidden;
  background:var(--glass);border:1px solid var(--stroke);color:var(--muted)}
.pill svg{width:19px;height:19px}
.pill .pstate{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(255,236,240,.1)}
.pill.on{color:var(--on-accent);border-color:transparent;background:linear-gradient(135deg,#ffc08a,var(--accent) 40%,var(--accent2));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent2) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.pill.on .pstate{background:rgba(28,11,18,.18)}

/* Ripple feedback */
.trow,.card,.mi,.pill,.resume,.rail-item,.top-row,.chip{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,236,230,.3) 0%,rgba(255,236,230,0) 70%);transform:scale(0);animation:rip .55s var(--out) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Track rows */
.trow{display:grid;grid-template-columns:22px 48px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 8px 8px 10px;border-radius:20px;cursor:pointer}
@media (min-width:640px){.trow{grid-template-columns:28px 48px minmax(0,1fr) 120px auto auto 52px}}
.trow:hover{background:var(--glass)}
.trow.is-on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 85%)}
.trow.is-on .tt{color:#ffb38f}
.tcov{width:48px;height:48px;border-radius:15px;object-fit:cover;box-shadow:0 6px 14px -6px rgba(0,0,0,.8);flex:none}
.tnum{font-variant-numeric:tabular-nums;color:var(--faint);font-size:14px;text-align:center}
.tdur{font-variant-numeric:tabular-nums;color:var(--faint);font-size:13px;text-align:right}
@media (max-width:639px){.tdur{display:none}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite;transform-origin:bottom;height:14px}
.eq i:nth-child(2){animation-delay:-.3s;background:var(--accent2)}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* Covers & cards */
.mosaic{display:grid;gap:2px;overflow:hidden;background:rgba(0,0,0,.4);box-shadow:0 18px 36px -18px rgba(0,0,0,.85)}
.mosaic img{width:100%;height:100%;object-fit:cover;min-width:0;min-height:0;display:block}
.m1{grid-template:1fr/1fr}.m2{grid-template:1fr/1fr 1fr}.m3{grid-template:1fr 1fr/1fr 1fr}.m3 img:first-child{grid-row:1/3}.m4{grid-template:1fr 1fr/1fr 1fr}
.gentile{display:grid;overflow:hidden;box-shadow:0 18px 36px -18px rgba(0,0,0,.85)}
.gentile svg{width:100%;height:100%;display:block}
.gentile text{font-family:Syne,Outfit,sans-serif;font-weight:800;font-size:54px;fill:rgba(255,255,255,.93)}
.icontile{display:grid;place-items:center;color:#fff;box-shadow:0 18px 36px -18px rgba(0,0,0,.85)}
.icontile svg{width:42%;height:42%}
.card{display:block;border-radius:28px;padding:10px;text-align:left}
.card:hover{background:var(--glass)}
.hscroll{scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.resume{display:flex;align-items:center;gap:16px;padding:14px;border-radius:32px;cursor:pointer;border:1px solid var(--stroke);
  background:linear-gradient(120deg,color-mix(in srgb,var(--amb1) 42%,transparent),color-mix(in srgb,var(--amb2) 24%,transparent) 60%,rgba(255,240,245,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 48px -24px color-mix(in srgb,var(--amb2) 70%,transparent)}
.resume-cover{width:84px;height:84px;border-radius:24px;object-fit:cover;flex:none;box-shadow:0 12px 24px -10px rgba(0,0,0,.8)}
.chip{height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;background:var(--glass);border:1px solid var(--stroke)}
.welcome{border-radius:38px}
.orb{width:124px;height:124px;position:relative;display:grid;place-items:center;animation:floaty 4.2s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:0;border-radius:42% 58% 63% 37%/41% 44% 56% 59%;background:linear-gradient(140deg,#ffc08a,var(--accent2) 55%,var(--accent3));
  box-shadow:0 22px 54px -14px color-mix(in srgb,var(--accent2) 80%,transparent),inset 0 2px 0 rgba(255,255,255,.4);animation:spin 16s linear infinite}
.orb>span{position:relative;color:var(--on-accent)}
.orb svg{width:46px;height:46px}
.logo{width:34px;height:34px;border-radius:42% 58% 63% 37%/41% 44% 56% 59%;background:linear-gradient(140deg,#ffc08a,var(--accent2) 55%,var(--accent3));box-shadow:0 8px 20px -6px color-mix(in srgb,var(--accent2) 80%,transparent)}
.rail-item{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.rail-item:hover{color:var(--fg);background:var(--glass)}
.rail-item[aria-current]{color:var(--on-accent);background:linear-gradient(135deg,#ffc08a,var(--accent) 35%,var(--accent2));box-shadow:0 10px 22px -10px color-mix(in srgb,var(--accent2) 80%,transparent)}
.rail-item svg{width:22px;height:22px}

/* Ranges */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2)) 0/var(--p,0%) 100% no-repeat,rgba(255,236,240,.15)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent2) 28%,transparent),0 3px 8px rgba(0,0,0,.5);transition:transform .25s var(--spring)}
.rng:active::-webkit-slider-thumb{transform:scale(1.3)}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.rng.sm{height:4px}
.rng.sm::-webkit-slider-thumb{width:14px;height:14px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ico svg{width:22px;height:22px}

/* Full-screen player */
#player{position:fixed;inset:0;z-index:50;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--ink);
  transform:translate3d(0,102%,0);visibility:hidden;transition:transform .5s var(--out),visibility 0s linear .5s}
#player.open{transform:none;visibility:visible;transition:transform .5s var(--out),visibility 0s}
#pBgWrap{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#pBg{position:absolute;left:-15%;top:-15%;width:130%;height:130%;object-fit:cover;filter:blur(42px) saturate(1.6);opacity:.75}
.pShade{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 34%,transparent,rgba(23,12,29,.6) 75%),linear-gradient(180deg,rgba(23,12,29,.25),rgba(23,12,29,.88) 85%)}
.pIn{position:relative;max-width:470px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.stage{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
#viz{position:absolute;left:-18%;top:-18%;width:136%;height:136%;pointer-events:none}
#pCover{position:relative;width:72%;aspect-ratio:1/1;max-width:100%;border-radius:36px;object-fit:cover;will-change:transform;
  box-shadow:0 34px 70px -22px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1);transition:transform .5s var(--out)}
body:not(.is-playing) #pCover{transform:scale(.9)}
body.is-playing #pCover{transition:transform .08s linear}

/* Overlays */
.ovl{position:fixed;inset:0;z-index:70;background:rgba(14,6,18,.55);display:flex;align-items:flex-end;justify-content:center}
.ovl[hidden],#qpanel[hidden],#mini[hidden]{display:none!important}
.sheetbox{width:100%;max-width:460px;border-radius:30px 30px 0 0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 16px);max-height:84vh;overflow-y:auto}
@media (min-width:768px){.ovl{align-items:center}.sheetbox{border-radius:28px;padding-bottom:16px}}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 22px;text-align:left;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--glass2)}
.mi svg{width:22px;height:22px;flex:none;color:var(--muted)}
#qpanel{position:fixed;inset:0;z-index:60;overflow-y:auto;background:rgba(23,12,29,.88);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
@media (min-width:768px){#qpanel{left:auto;width:410px;top:16px;bottom:16px;right:16px;border-radius:30px;border:1px solid var(--stroke)}}
#toast{position:fixed;z-index:90;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px}
body.dragging #main{outline:2px dashed var(--accent);outline-offset:-10px;border-radius:24px}

/* Stats */
.stat-hero{border-radius:34px;padding:26px 24px;border:1px solid var(--stroke);
  background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--amb1) 40%,transparent),transparent 60%),radial-gradient(120% 120% at 100% 100%,color-mix(in srgb,var(--amb3) 35%,transparent),transparent 60%),rgba(255,240,245,.05)}
.stat-card{border-radius:30px;padding:20px}
.dial-wrap{position:relative;width:112px;height:112px;flex:none;display:grid;place-items:center}
.dial{position:absolute;inset:0;transform:rotate(-90deg)}
.dial-bg{fill:none;stroke:rgba(255,236,240,.12);stroke-width:7}
.dial-fg{fill:none;stroke:url(#gradRing);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--out)}
.dial-img{width:78px;height:78px;border-radius:50%;object-fit:cover}
.dial-av{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-family:Syne,sans-serif;font-weight:800;font-size:30px;color:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wbar{width:100%;max-width:30px;height:96px;border-radius:12px;background:rgba(255,236,240,.08);display:flex;align-items:flex-end;overflow:hidden}
.wfill{width:100%;height:100%;border-radius:12px;background:linear-gradient(180deg,var(--accent2),var(--accent));opacity:.8;transform:scaleY(0);transform-origin:bottom;transition:transform .8s var(--spring)}
.wfill.today{opacity:1;box-shadow:0 0 18px color-mix(in srgb,var(--accent2) 60%,transparent)}
.top-row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:22px}
.rank{width:26px;text-align:center;font-family:Syne,sans-serif;font-weight:800;font-size:18px;color:var(--faint)}
.top-row:first-child .rank{color:var(--accent)}
.hbar{height:5px;border-radius:5px;background:rgba(255,236,240,.1);overflow:hidden}
.hfill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .9s var(--out)}

/* Motion (transitions 200–400 ms, loops on transform/opacity only) */
#main.entering .trow,#main.entering .card,#main.entering .top-row{animation:rowIn .36s var(--out) both;animation-delay:calc(var(--i,0) * 22ms)}
#mini:not([hidden]){animation:miniIn .42s var(--spring)}
.ovl:not([hidden]){animation:fadeIn .2s ease-out}
.ovl:not([hidden]) .sheetbox{animation:sheetUp .34s var(--out)}
#qpanel:not([hidden]){animation:sheetUp .34s var(--out)}
@media (min-width:768px){.ovl:not([hidden]) .sheetbox{animation:popIn .26s var(--out)}#qpanel:not([hidden]){animation:slideLeft .34s var(--out)}}
#toast:not([hidden]){animation:toastIn .3s var(--spring)}
@keyframes rowIn{from{opacity:0;transform:translate3d(0,12px,0) scale(.98)}to{opacity:1;transform:none}}
@keyframes miniIn{from{opacity:0;transform:translate3d(0,24px,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translate3d(0,48px,0);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes slideLeft{from{transform:translate3d(48px,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important}

/* ---------------- Audio engine: your files through an analyser ---------------- */
const AU = new Audio(); AU.preload = 'auto'; AU.setAttribute('playsinline', '');
const E = { ctx:null, master:null, analyser:null, data:null, offset:0, playing:false, routed:false };

function nextId(auto){
  const ids = ctxIds(S.ctx); if (!ids.length) return null;
  if (S.shuffle){
    if (ids.length === 1) return auto && S.repeat === 'off' ? null : ids[0];
    syncBag();
    if (!bag.length){ if (auto && S.repeat === 'off') return null; refillBag(); } // a full round is done
    return bag.pop() ?? null;
  }
  const i = ids.indexOf(S.cur);
  if (i < 0) return ids[0];
  if (i + 1 >= ids.length) return auto && S.repeat === 'off' ? null : ids[0];
  return ids[i + 1];
}
function next(){
  const n = S.upNext.length ? S.upNext.shift() : nextId(false); if (n == null) return;
  const was = E.playing; moveTo(n); was ? startEngine() : refresh(); updateNow();
}
function prev(){
  if (pos() > 3){ seekTo(0); paintProgress(); return; }
  let n = null;
  if (S.shuffle){ while (hist.length){ const h = hist.pop(); if (byId(h)){ n = h; break; } } if (n != null && S.cur != null && !bag.includes(S.cur)) bag.push(S.cur); }
  else { const ids = ctxIds(S.ctx), i = ids.indexOf(S.cur); if (ids.length) n = i < 0 ? ids[0] : ids[(i - 1 + ids.length) % ids.length]; }
  if (n == null){ seekTo(0); paintProgress(); return; }
  const was = E.playing; moveTo(n, false); was ? startEngine() : refresh(); updateNow();
}
function onEnded(){
  if (S.repeat === 'one'){ E.offset = 0; startEngine(); return; }
  const n = S.upNext.length ? S.upNext.shift() : nextId(true);
  if (n == null){ halt(); E.offset = 0; try { AU.currentTime = 0; } catch(e){} updateMedia(); refresh(); return; }
  moveTo(n); startEngine(); updateNow();
}
function setShuffle(v, quiet){
  S.shuffle = v; store.set('echo-shuffle', v); if (v) refillBag();
  updateNow(); renderQueue(); if (!quiet) toast(v ? 'Lecture aléatoire activée' : 'Lecture aléatoire désactivée');
  if (S.view !== 'search' && S.view !== 'stats') renderMain();

function cycleRepeat(){ S.repeat = { off:'all', all:'one', one:'off' }[S.repeat]; store.set('echo-repeat', S.repeat); updateNow(); renderQueue(); }

/* ---------------- Listening stats (stored on this device only) ---------------- */
const freshStats = () => ({ v:1, since:Date.now(), totalMs:0, tracks:{}, days:{} });
let ST = store.get('echo-stats', null); if (!ST || typeof ST !== 'object' || !ST.tracks || !ST.days) ST = freshStats();
let sess = { id:null, listened:0, counted:false }, stLast = null, stDirty = false;
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function stReset(id){ sess = { id, listened:0, counted:false }; stLast = null; }
function addListen(t, sec){
  const ms = sec * 1000, D = ST.days[dayKey(new Date())] ||= { ms:0, plays:0 };
  const r = ST.tracks[t.id] ||= { plays:0, ms:0, last:0, title:t.title, artist:t.artist };
  ST.totalMs += ms; D.ms += ms; r.ms += ms; r.title = t.title; r.artist = t.artist;
  sess.listened += sec;
  if (!sess.counted && sess.listened >= 30){ sess.counted = true; r.plays++; r.last = Date.now(); D.plays++; } // one listen = 30 s heard in one go
  stDirty = true;
}
AU.addEventListener('timeupdate', () => {
  const t = byId(+AU.dataset.id), ct = AU.currentTime;
  if (!t || AU.paused){ stLast = ct; return; }
  if (sess.id !== t.id) stReset(t.id);
  if (stLast != null){ const d = ct - stLast; if (d > 0 && d < 2) addListen(t, d); }
  stLast = ct;
});
AU.addEventListener('seeking', () => { stLast = null; });

/* ---------------- Ambient colours from the cover ---------------- */
const DEFAULT_PAL = [[255,138,92],[255,61,139],[138,92,255]];
const PAL = {};
function rgb2hsl(r, g, b){ r /= 255; g /= 255; b /= 255; const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn)/2; let h = 0, s = 0;
  if (mx !== mn){ const d = mx - mn; s = l > .5 ? d/(2 - mx - mn) : d/(mx + mn); h = mx === r ? (g - b)/d + (g < b ? 6 : 0) : mx === g ? (b - r)/d + 2 : (r - g)/d + 4; h /= 6; }
  return [h, s, l]; }
function hsl2rgb(h, s, l){ const f = n => { const k = (n + h*12) % 12, a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); }; return [f(0), f(8), f(4)]; }
function extractPalette(src){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { try {
      const Z = 28, c = document.createElement('canvas'); c.width = c.height = Z;
      const g = c.getContext('2d', { willReadFrequently:true }); g.drawImage(img, 0, 0, Z, Z);
      const d = g.getImageData(0, 0, Z, Z).data, bins = []; let sw = 0, ss = 0;
      for (let i = 0; i < d.length; i += 4){
        const [h, s, l] = rgb2hsl(d[i], d[i+1], d[i+2]); sw++; ss += s;
        if (l < .1 || l > .93) continue;
        const k = Math.floor(h * 12) % 12, w = .12 + s*s, b = bins[k] ||= { w:0, h:0, s:0, l:0 };
        b.w += w; b.h += h*w; b.s += s*w; b.l += l*w;
      }
      if (ss / sw < .12) return res(DEFAULT_PAL); // greyscale artwork keeps the house colours
      const top = bins.map((b, k) => b && { k, w:b.w, h:b.h/b.w, s:b.s/b.w, l:b.l/b.w }).filter(Boolean).sort((a, b) => b.w - a.w);
      const pick = [];
      for (const b of top){ if (pick.every(p => Math.min(Math.abs(p.k - b.k), 12 - Math.abs(p.k - b.k)) >= 2)) pick.push(b); if (pick.length === 3) break; }
      if (!pick.length) return res(DEFAULT_PAL);
      while (pick.length < 3){ const b = pick[0]; pick.push({ h:(b.h + .09*pick.length) % 1, s:b.s, l:b.l }); }
      res(pick.map(b => hsl2rgb(b.h, Math.min(1, Math.max(.6, b.s*1.2)), Math.min(.64, Math.max(.5, b.l)))));
    } catch(e){ res(DEFAULT_PAL); } };
    img.onerror = () => res(DEFAULT_PAL); img.src = src;
  });
}
let ambTok = 0;
async function applyAmbient(t){
  const tok = ++ambTok; let pal = DEFAULT_PAL;
  if (t) pal = PAL[t.id] || (PAL[t.id] = t.rec && t.rec.cover ? await extractPalette(t.rec.cover) : [t.hues[0], t.hues[1], (t.hues[0] + 40) % 360].map(h => hsl2rgb(h/360, .75, .58)));
  if (tok !== ambTok) return;
  const css = c => `rgb(${c[0]|0} ${c[1]|0} ${c[2]|0})`, r = document.documentElement.style;
  r.setProperty('--amb1', css(pal[0])); r.setProperty('--amb2', css(pal[1])); r.setProperty('--amb3', css(pal[2]));
  VZ.target = pal.map(c => c.slice());
}

/* ---------------- Visualizer (canvas, driven by the AnalyserNode) ---------------- */
const VZ = { cv:$('viz'), g:null, w:0, h:0, dpr:1, N:96, pts:new Float32Array(96), sm:new Float32Array(96), xy:new Float32Array(192), parts:[], rot:0,
  col:DEFAULT_PAL.map(c => c.slice()), target:DEFAULT_PAL.map(c => c.slice()), bass:0, bassAvg:.2, lastBeat:0, kick:0, energy:0 };
VZ.g = VZ.cv.getContext('2d');
const playerOpen = () => $('player').classList.contains('open');
function sizeViz(){
  const r = VZ.cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (w && (VZ.cv.width !== w || VZ.cv.height !== h)){ VZ.cv.width = w; VZ.cv.height = h; }
  VZ.w = r.width; VZ.h = r.height; VZ.dpr = dpr;
}
function analyse(){
  if (!(E.playing && E.analyser)){ VZ.bass *= .9; VZ.kick *= .9; return; }
  E.analyser.getByteFrequencyData(E.data);
  let b = 0; for (let i = 1; i < 7; i++) b += E.data[i]; b /= 6 * 255;
  VZ.bass = VZ.bass * .6 + b * .4; VZ.bassAvg = VZ.bassAvg * .97 + b * .03;
  const now = performance.now();
  if (b > VZ.bassAvg * 1.15 + .04 && b > .42 && now - VZ.lastBeat > 200){ VZ.lastBeat = now; VZ.kick = 1; if (playerOpen() && !RM.matches) spawn(Math.round(4 + b * 8)); }
  VZ.kick *= .9;
}
function spawn(n){ for (let i = 0; i < n && VZ.parts.length < 90; i++) VZ.parts.push({ a:Math.random()*Math.PI*2, r:0, v:50 + Math.random()*130, life:1, size:1.5 + Math.random()*3, c:Math.floor(Math.random()*3) }); }
function vizLayer(R, amp, rot, alpha, col, t){
  const { g, N, sm:pts, xy } = VZ, cx = VZ.w/2, cy = VZ.h/2;
  for (let i = 0; i < N; i++){
    const a = i/N * Math.PI*2 + rot, idle = Math.sin(t*1.1 + i*.37)*.018 + Math.sin(t*.7 + i*.13)*.014;
    const r = R * (1 + pts[i]*.55*amp + idle + VZ.kick*.035*amp);
    xy[2*i] = cx + Math.cos(a)*r; xy[2*i+1] = cy + Math.sin(a)*r;
  }
  g.beginPath();
  g.moveTo((xy[0] + xy[2*(N-1)])/2, (xy[1] + xy[2*(N-1)+1])/2);
  for (let i = 0; i < N; i++){ const j = (i + 1) % N; g.quadraticCurveTo(xy[2*i], xy[2*i+1], (xy[2*i] + xy[2*j])/2, (xy[2*i+1] + xy[2*j+1])/2); }
  g.closePath();
  const c = `${col[0]|0},${col[1]|0},${col[2]|0}`, grd = g.createRadialGradient(cx, cy, R*.55, cx, cy, R*1.65);
  grd.addColorStop(0, `rgba(${c},${alpha})`); grd.addColorStop(1, `rgba(${c},0)`);
  g.fillStyle = grd; g.fill();
  g.strokeStyle = `rgba(${c},${alpha*.95})`; g.lineWidth = 1.6; g.stroke();
}
function drawViz(dt){
  if (!VZ.w) sizeViz(); if (!VZ.w) return;
  const { g, N, pts } = VZ, W = VZ.w, H = VZ.h, cx = W/2, cy = H/2, R = Math.min(W, H) * .3, t = performance.now()/1000;
  const k = Math.min(1, dt * 2.5);
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) VZ.col[a][b] += (VZ.target[a][b] - VZ.col[a][b]) * k;
  const live = E.playing && E.analyser && !RM.matches; let en = 0;
  for (let i = 0; i < N; i++){
    const m = i < N/2 ? i : N - 1 - i, bin = 2 + Math.floor(Math.pow(m/(N/2), 1.35) * 150);
    const v = live ? E.data[bin]/255 : 0, tg = v*v;
    pts[i] += (tg - pts[i]) * (tg > pts[i] ? .45 : .12); en += pts[i];
  }
  VZ.energy = en / N;
  // spatial smoothing so the outline stays organic instead of spiky
  for (let i = 0; i < N; i++){ const a = (i + N - 2) % N, b = (i + N - 1) % N, c = (i + 1) % N, d = (i + 2) % N;
    VZ.sm[i] = Math.min(.85, (pts[a] + 2*pts[b] + 3*pts[i] + 2*pts[c] + pts[d]) / 9); }
  if (!RM.matches) VZ.rot += dt * (.08 + VZ.bass * .5);
  g.setTransform(VZ.dpr, 0, 0, VZ.dpr, 0, 0); g.clearRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  const tt = RM.matches ? 0 : t;
  vizLayer(R, 1, VZ.rot, .5, VZ.col[0], tt);
  vizLayer(R*.97, .7, -VZ.rot*1.3, .42, VZ.col[1], tt + 3);
  vizLayer(R*1.04, .45, VZ.rot*.6 + 1, .32, VZ.col[2], tt + 7);
  for (let i = VZ.parts.length - 1; i >= 0; i--){
    const p = VZ.parts[i]; p.r += p.v*dt; p.v *= .985; p.life -= dt*.9;
    if (p.life <= 0){ VZ.parts.splice(i, 1); continue; }
    const rr = R*1.08 + p.r, col = VZ.col[p.c];
    g.fillStyle = `rgba(${col[0]|0},${col[1]|0},${col[2]|0},${p.life*.9})`;
    g.beginPath(); g.arc(cx + Math.cos(p.a)*rr, cy + Math.sin(p.a)*rr, p.size*(.6 + p.life*.6), 0, Math.PI*2); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

/* ---------------- One frame loop, running only while something moves ---------------- */
let rafId = 0, lastTs = 0, dragging = false, lastFrac = -1, lastCs = '';
function paintProgress(){
  const tr = byId(S.cur), d = durOf(tr), p = tr ? pos() : 0, frac = isFinite(d) && d > 0 ? Math.min(1, p/d) : 0;
  if (dragging || frac === lastFrac) return;
  const s = $('pSeek'); s.value = frac*1000; s.style.setProperty('--p', frac*100 + '%');
  const cs = fmt(p); if (cs !== lastCs){ $('pCur').textContent = cs; lastCs = cs; }
  $('mProg').style.transform = `scaleX(${frac})`; lastFrac = frac;
}
const wantLoop = () => !document.hidden && (E.playing || dragging || (playerOpen() && !RM.matches && (VZ.energy > .004 || VZ.parts.length > 0)));
function ensureLoop(){ if (!rafId && wantLoop()){ lastTs = 0; rafId = requestAnimationFrame(frame); } }
function frame(ts){
  rafId = 0;
  const dt = lastTs ? Math.min(.05, (ts - lastTs)/1000) : 1/60; lastTs = ts;
  paintProgress(); analyse();
  if (!RM.matches && E.playing){
    const h = $('halo'); h.style.transform = `scale(${1 + VZ.bass*.38})`; h.style.opacity = String(.16 + VZ.bass*.42);
  }
  if (playerOpen()){
    if (!RM.matches) drawViz(dt);
    if (E.playing && !RM.matches) $('pCover').style.transform = `scale(${1 + VZ.kick*.028 + VZ.bass*.012})`;
  }
  if (wantLoop()) rafId = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushStats(); else ensureLoop(); }); // nothing is drawn in the background
window.addEventListener('resize', () => { VZ.w = 0; if (playerOpen()) drawViz(0); });

/* ---------------- Covers for collections ---------------- */
function realCovers(ids, n = 4){
  const out = [], seen = new Set();
  for (const id of ids){ const t = byId(id), c = t && t.rec && t.rec.cover; if (!c || seen.has(c)) continue; seen.add(c); out.push(c); if (out.length === n) break; }
  return out;
}
function genTile(name, cls){
  const h = hashHue(name || '?'), ch = ([...(name || '?').trim()][0] || '?').toUpperCase();
  return `<div class="gentile ${cls}" style="background:linear-gradient(140deg,hsl(${h} 88% 66%),hsl(${(h + 55) % 360} 72% 36%))"><svg viewBox="0 0 100 100" aria-hidden="true"><text x="50" y="56" text-anchor="middle" dominant-baseline="middle">${esc(ch)}</text></svg></div>`;
}
function mosaic(ids, cls, name){
  const cs = realCovers(ids);
  if (!cs.length) return genTile(name, cls);
  return `<div class="mosaic m${cs.length} ${cls}">${cs.map(c => `<img src="${c}" alt="">`).join('')}</div>`;
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]:not(button)')){ e.preventDefault(); e.target.click(); return; }
  if (e.target.matches('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && e.shiftKey){ seekTo(pos() + 10); paintProgress(); }
  else if (e.key === 'ArrowLeft' && e.shiftKey){ seekTo(pos() - 10); paintProgress(); }
  else if (e.key === 'Escape'){ if (!$('menu').hidden) closeMenu(); else if (!$('dlg').hidden) closeDlg(); else if (!$('qpanel').hidden) closeQueue(); else closePlayer(); }
});

/* ---------------- My music: import + storage (IndexedDB, this device only) ---------------- */
const DB = (() => {
  let p;
  const open = () => p = p || new Promise((res, rej) => {
    const r = indexedDB.open('echo-musique', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('songs', { keyPath:'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('songs', mode), req = fn(t.objectStore('songs'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return { all:() => tx('readonly', s => s.getAll()), put:v => tx('readwrite', s => s.put(v)), del:id => tx('readwrite', s => s.delete(id)) };
})();
let importing = 0, toastT;

function addFileTrack(rec){

  const t = { id:rec.id, title:rec.title, artist:rec.artist, file:true, url:URL.createObjectURL(rec.blob), duration:rec.duration, hues:[h, (h + 50) % 360], rec };
  COV[t.id] = rec.cover || makeCover(t); TRACKS.push(t); TMAP.set(t.id, t);
  return t;
}
function probe(t){

  a.onloadedmetadata = () => { if (isFinite(a.duration) && a.duration > 0){ t.duration = t.rec.duration = a.duration; DB.put(t.rec).catch(() => {}); refresh(); } a.removeAttribute('src'); };

}
async function importFiles(files){
  const audio = [...files].filter(f => (f.type || '').startsWith('audio/') || /\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name));
  if (!audio.length){ toast('Aucun fichier audio reconnu (MP3, M4A, AAC, FLAC, WAV, OGG).'); return; }
  importing = audio.length; if (S.view !== 'mine') go('mine'); else renderMain();
  const base = Date.now(); let saved = 0;
  for (const [i, f] of audio.entries()){
    const name = f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim(), parts = name.split(/\s+[-–]\s+/);
    const title = (parts.length > 1 ? parts.slice(1).join(' - ') : name).replace(/^\d{1,3}[\s.\-]+/, '') || name;
    const tags = await readTags(f);
    const rec = { id:base + i, title:tags.title || title, artist:tags.artist || (parts.length > 1 ? parts[0] : 'Artiste inconnu'), blob:f, duration:NaN, added:base + i,
      tagged:true, cover:tags.pic ? await picToCover(tags.pic) : null };
    const t = addFileTrack(rec);
    try { await DB.put(rec); saved++; } catch(e){}
    probe(t);
  }
  importing = 0;
  if (!byId(S.cur)){ S.cur = ctxIds('mine')[0]; S.ctx = 'mine'; updateMedia(); }
  refresh();
  const n = audio.length, s = n > 1 ? 's' : '';
  toast(saved === n ? `${n} titre${s} ajouté${s}` : `${n} titre${s} ajouté${s}, mais la mémoire du navigateur est pleine ou bloquée : ils disparaîtront à la fermeture.`);
}

}

/* ---------------- Tags & real covers (MP3 ID3, FLAC, M4A) ---------------- */
function dec(bytes, enc){
  try {
    if (enc === 1){
      if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
      if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
      return new TextDecoder('utf-16le').decode(bytes);
    }
    if (enc === 2) return new TextDecoder('utf-16be').decode(bytes);
    if (enc === 3) return new TextDecoder('utf-8').decode(bytes);
    return new TextDecoder('iso-8859-1').decode(bytes);
  } catch(e){ return ''; }
}
const cleanTag = s => (s || '').split('\0')[0].trim();
function parseID3(b){
  const ver = b[3], out = {};
  const ss = i => ((b[i]&127)<<21) | ((b[i+1]&127)<<14) | ((b[i+2]&127)<<7) | (b[i+3]&127);
  const be = i => ((b[i]<<24)>>>0) + (b[i+1]<<16) + (b[i+2]<<8) + b[i+3];
  let o = 10; const end = Math.min(b.length, ss(6) + 10);
  if (b[5] & 0x40) o += ver === 4 ? ss(10) : be(10) + 4;
  while (o + (ver === 2 ? 6 : 10) <= end){
    let id, sz, h;
    if (ver === 2){ id = String.fromCharCode(b[o],b[o+1],b[o+2]); sz = (b[o+3]<<16) | (b[o+4]<<8) | b[o+5]; h = 6; }
    else { id = String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]); sz = ver === 4 ? ss(o+4) : be(o+4); h = 10; }
    if (!/^[A-Z0-9]{3,4}$/.test(id) || sz <= 0) break;
    const f = b.subarray(o + h, Math.min(end, o + h + sz));
    if (id === 'TIT2' || id === 'TT2') out.title = cleanTag(dec(f.subarray(1), f[0]));
    else if (id === 'TPE1' || id === 'TP1') out.artist = cleanTag(dec(f.subarray(1), f[0]));
    else if ((id === 'APIC' || id === 'PIC') && !out.pic){
      const enc = f[0]; let p = 1, mime;
      if (id === 'PIC'){ mime = 'image/' + String.fromCharCode(f[1],f[2],f[3]).toLowerCase().replace('jpg','jpeg'); p = 4; }
      else { let q = p; while (q < f.length && f[q]) q++; mime = dec(f.subarray(p, q), 0) || 'image/jpeg'; p = q + 1; }
      p++;
      if (enc === 1 || enc === 2){ while (p + 1 < f.length && !(f[p] === 0 && f[p+1] === 0)) p += 2; p += 2; }
      else { while (p < f.length && f[p]) p++; p++; }
      if (p < f.length) out.pic = { mime: mime.includes('/') ? mime : 'image/' + mime, data: f.slice(p) };
    }
    o += h + sz;
  }
  return out;
}
function parseFLAC(b){
  const out = {}, dv = new DataView(b.buffer, b.byteOffset, b.byteLength); let o = 4;
  while (o + 4 <= b.length){
    const hdr = b[o], type = hdr & 127, len = (b[o+1]<<16) | (b[o+2]<<8) | b[o+3], s = o + 4;
    if (s + len > b.length) break;
    if (type === 4){
      let p = s; p += 4 + dv.getUint32(p, true); const n = dv.getUint32(p, true); p += 4;
      for (let i = 0; i < n && p + 4 <= s + len; i++){
        const l = dv.getUint32(p, true); p += 4;
        const str = new TextDecoder().decode(b.subarray(p, p + l)); p += l;
        const k = str.indexOf('='), key = str.slice(0, k).toUpperCase(), val = str.slice(k + 1).trim();
        if (key === 'TITLE' && !out.title) out.title = val;
        if (key === 'ARTIST' && !out.artist) out.artist = val;
      }
    } else if (type === 6 && !out.pic){
      let p = s + 4; const ml = dv.getUint32(p); p += 4;
      const mime = new TextDecoder().decode(b.subarray(p, p + ml)); p += ml;
      p += 4 + dv.getUint32(p) + 16; const L = dv.getUint32(p); p += 4;
      out.pic = { mime, data: b.slice(p, p + L) };
    }
    if (hdr & 128) break; o = s + len;
  }
  return out;
}
function parseMP4(b){
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength), out = {};
  const kids = (s, e) => { const r = []; let o = s;
    while (o + 8 <= e){ let sz = dv.getUint32(o), h = 8; const ty = String.fromCharCode(b[o+4],b[o+5],b[o+6],b[o+7]);
      if (sz === 1){ sz = Number(dv.getBigUint64(o + 8)); h = 16; } else if (sz === 0) sz = e - o;
      if (sz < h || o + sz > e) break; r.push({ ty, s:o + h, e:o + sz }); o += sz; }
    return r; };
  const find = (l, ty) => l.find(a => a.ty === ty);
  const moov = find(kids(0, b.length), 'moov'); if (!moov) return out;
  const udta = find(kids(moov.s, moov.e), 'udta'); if (!udta) return out;
  const meta = find(kids(udta.s, udta.e), 'meta'); if (!meta) return out;
  const ilst = find(kids(meta.s + 4, meta.e), 'ilst'); if (!ilst) return out;
  for (const it of kids(ilst.s, ilst.e)){
    const d = find(kids(it.s, it.e), 'data'); if (!d) continue;
    const kind = dv.getUint32(d.s) & 0xffffff, payload = b.subarray(d.s + 8, d.e);
    if (it.ty === '©nam') out.title = new TextDecoder().decode(payload).trim();
    else if (it.ty === '©ART') out.artist = new TextDecoder().decode(payload).trim();
    else if (it.ty === 'covr' && !out.pic) out.pic = { mime: kind === 14 ? 'image/png' : 'image/jpeg', data: payload.slice() };
  }
  return out;
}
async function readTags(blob){
  try {
    const h = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    const s4 = o => String.fromCharCode(h[o], h[o+1], h[o+2], h[o+3]);
    if (h[0] === 0x49 && h[1] === 0x44 && h[2] === 0x33){
      const size = ((h[6]&127)<<21) | ((h[7]&127)<<14) | ((h[8]&127)<<7) | (h[9]&127);
      if (size > 30e6) return {};
      return parseID3(new Uint8Array(await blob.slice(0, size + 10).arrayBuffer()));
    }
    if (s4(0) === 'fLaC') return parseFLAC(new Uint8Array(await blob.slice(0, Math.min(blob.size, 30e6)).arrayBuffer()));
    if (s4(4) === 'ftyp' && blob.size < 80e6) return parseMP4(new Uint8Array(await blob.arrayBuffer()));
  } catch(e){}
  return {};
}
async function picToCover(pic){
  const url = URL.createObjectURL(new Blob([pic.data], { type:pic.mime }));
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement('canvas'); c.width = c.height = 320;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext('2d').drawImage(img, (img.naturalWidth - s)/2, (img.naturalHeight - s)/2, s, s, 0, 0, 320, 320);
    return c.toDataURL('image/jpeg', .86);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
async function enrich(t){
  const tags = await readTags(t.rec.blob);
  if (tags.title) t.title = t.rec.title = tags.title;
  if (tags.artist) t.artist = t.rec.artist = tags.artist;
  if (tags.pic){ const c = await picToCover(tags.pic); if (c){ t.rec.cover = c; COV[t.id] = c; } }
  t.rec.tagged = true; DB.put(t.rec).catch(() => {}); refresh();
}

  const first = $('menuBox').querySelector('button'); if (first) first.focus({ preventScroll:true });
}
function closeMenu(){ $('menu').hidden = true; }
$('menu').addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('[data-mi]');
  if (b){ const fn = menuFns[+b.dataset.mi]; closeMenu(); if (fn) fn(); return; }
  if (e.target === $('menu')) closeMenu();
});
function openDlg(title, value, okLabel, onOk){
  $('dlgTitle').textContent = title; $('dlgOk').textContent = okLabel; dlgOk = onOk;
  const inp = $('dlgInput'); inp.value = value; $('dlg').hidden = false;
  setTimeout(() => { inp.focus(); inp.select(); }, 40);
}
function closeDlg(){ $('dlg').hidden = true; dlgOk = null; }
$('dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('dlgInput').value.trim().slice(0, 60); if (!v){ $('dlgInput').focus(); return; }
  const fn = dlgOk; closeDlg(); if (fn) fn(v);
});
$('dlgCancel').onclick = closeDlg;
$('dlg').addEventListener('click', e => { e.stopPropagation(); if (e.target === $('dlg')) closeDlg(); });
$('dlgInput').addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });

function createPlaylist(ids = []){
  openDlg('Nouvelle playlist', `Ma playlist n° ${S.playlists.length + 1}`, 'Créer', name => {
    const pl = { id:Date.now(), name, ids:[...ids] }; S.playlists.push(pl); savePl();
    if (ids.length){ toast(`Ajouté à ${name}`); refresh(); } else { toast(`Playlist « ${name} » créée`); go('playlist', pl.id); }
  });
}
function openAddToPlaylist(id){
  const t = byId(id); if (!t) return;
  openMenu(`<p class="font-semibold">Ajouter à une playlist</p><p class="text-sm text-muted truncate">${esc(t.title)}</p>`, [
    { icon:ICON.plus, label:'Nouvelle playlist', fn:() => createPlaylist([id]) },
    ...S.playlists.map(pl => ({ icon:ICON.note, label:pl.name, hint:pl.ids.includes(id) ? 'Déjà dedans' : nt(ctxIds('pl:' + pl.id).length), fn:() => {
      if (pl.ids.includes(id)){ toast(`Déjà dans ${pl.name}`); return; }
      pl.ids.push(id); savePl(); toast(`Ajouté à ${pl.name}`); refresh();
    }}))
  ]);
}
function openTrackMenu(id, ctx){
  const t = byId(id); if (!t) return;
  const items = [
    { icon:ICON.queue, label:'Lire ensuite', fn:() => { S.upNext.unshift(id); toast('Sera lu juste après'); refresh(); } },
    { icon:ICON.queue, label:"Ajouter à la file d'attente", fn:() => { S.upNext.push(id); toast("Ajouté à la file d'attente"); refresh(); } },
    { icon:ICON.pladd, label:'Ajouter à une playlist', fn:() => openAddToPlaylist(id) }
  ];
  if (ctx && ctx.startsWith('pl:')){ const pl = plById(+ctx.slice(3));
    if (pl) items.push({ icon:ICON.close, label:'Retirer de cette playlist', fn:() => { pl.ids = pl.ids.filter(x => x !== id); savePl(); toast(`Retiré de ${pl.name}`); refresh(); } }); }
  items.push({ icon:ICON.search, label:"Voir les titres de l'artiste", fn:() => { S.query = t.artist; go('search'); } });
  items.push({ icon:ICON.trash, label:'Retirer de Ma musique', danger:true, fn:() => removeTrack(id) });
  openMenu(trackHead(t), items);
}
function openPlaylistMenu(plId){
  const pl = plById(plId); if (!pl) return;
  openMenu(`<p class="font-semibold truncate">${esc(pl.name)}</p><p class="text-sm text-muted">Playlist · ${nt(ctxIds('pl:' + pl.id).length)}</p>`, [
    { icon:ICON.queue, label:"Ajouter à la file d'attente", fn:() => { const ids = ctxIds('pl:' + pl.id); S.upNext.push(...ids); toast(`${nt(ids.length)} ajouté${ids.length > 1 ? 's' : ''} à la file`); refresh(); } },
    { icon:ICON.edit, label:'Renommer', fn:() => openDlg('Renommer la playlist', pl.name, 'Enregistrer', name => { pl.name = name; savePl(); refresh(); }) },
    { icon:ICON.trash, label:'Supprimer la playlist', danger:true, fn:() => openMenu(
      `<p class="font-semibold">Supprimer « ${esc(pl.name)} » ?</p><p class="text-sm text-muted">Les morceaux restent dans l'appli.</p>`, [
        { icon:ICON.trash, label:'Supprimer', danger:true, fn:() => { S.playlists = S.playlists.filter(p => p !== pl); savePl(); if (S.ctx === 'pl:' + pl.id) S.ctx = 'mine'; toast('Playlist supprimée'); go('lib'); } },
        { icon:ICON.close, label:'Annuler', fn:null }
      ]) }
  ]);
}

/* ---------------- Queue ---------------- */
function upcoming(){
  if (S.shuffle){ syncBag(); return bag.slice(-25).reverse(); }
  const ids = ctxIds(S.ctx), i = ids.indexOf(S.cur);
  let out = ids.slice(i + 1); if (S.repeat === 'all') out = out.concat(ids.slice(0, Math.max(0, i)));
  return out.slice(0, 25);
}
function openQueue(){ $('qpanel').hidden = false; renderQueue(); if (matchMedia('(hover:hover)').matches) $('qClose').focus({ preventScroll:true }); }
function closeQueue(){ $('qpanel').hidden = true; }
function renderQueue(){
  if ($('qpanel').hidden) return;
  const cur = byId(S.cur), up = S.upNext.map(byId).filter(Boolean), after = upcoming().map(byId).filter(Boolean);
  const qrow = (t, attrs, extra) => `<div class="trow !grid-cols-[48px_minmax(0,1fr)_auto]" ${attrs} role="button" tabindex="0">
      <img src="${COV[t.id]}" alt="" class="tcov"><div class="min-w-0"><p class="truncate font-semibold">${esc(t.title)}</p><p class="truncate text-sm text-muted">${esc(t.artist)}</p></div><div class="flex items-center">${extra || ''}</div></div>`;
  const sb = (a, i, icon, label, dis) => `<button class="ib disabled:opacity-25" data-${a}="${i}" aria-label="${label}" ${dis ? 'disabled' : ''}>${icon}</button>`;
  $('qBody').innerHTML = `
    <p class="eyebrow mt-3 mb-2">En cours</p>
    ${cur ? qrow(cur, 'data-qcur', E.playing ? `<span class="pr-3">${EQ}</span>` : '') : '<p class="text-sm text-muted">Rien pour le moment.</p>'}
    <div class="flex items-center justify-between mt-7 mb-2"><p class="eyebrow">Dans ta file</p>${up.length ? '<button data-qclear class="text-sm font-semibold text-muted">Tout effacer</button>' : ''}</div>
    ${up.length ? up.map((t, i) => qrow(t, `data-qplay="${i}"`, sb('qup', i, ICON.up, 'Monter', i === 0) + sb('qdown', i, ICON.down, 'Descendre', i === up.length - 1) + sb('qdel', i, ICON.close, 'Retirer de la file'))).join('')
      : `<p class="text-sm text-muted py-1">Vide pour l'instant. Touche ⋯ à côté d'un titre, puis « Ajouter à la file d'attente ».</p>`}
    <p class="eyebrow mt-7 mb-2">Ensuite, depuis ${esc(ctxLabel(S.ctx))}${S.shuffle ? ' · aléatoire' : ''}</p>
    ${after.length ? after.map(t => qrow(t, `data-cplay="${t.id}"`)).join('') : `<p class="text-sm text-muted py-1">${S.shuffle ? 'Tous les titres de ce tour ont été joués.' : 'Plus rien après ce titre.'}</p>`}`;
}
$('qpanel').addEventListener('click', e => {
  const q = k => e.target.closest(`[data-${k}]`); let b;
  if ((b = q('qup'))){ const i = +b.dataset.qup; [S.upNext[i-1], S.upNext[i]] = [S.upNext[i], S.upNext[i-1]]; renderQueue(); return; }
  if ((b = q('qdown'))){ const i = +b.dataset.qdown; [S.upNext[i+1], S.upNext[i]] = [S.upNext[i], S.upNext[i+1]]; renderQueue(); return; }
  if ((b = q('qdel'))){ S.upNext.splice(+b.dataset.qdel, 1); renderQueue(); return; }
  if (q('qclear')){ S.upNext = []; renderQueue(); return; }
  if ((b = q('qplay'))){ const [id] = S.upNext.splice(+b.dataset.qplay, 1); playTrack(id); return; }
  if ((b = q('cplay'))){ playTrack(+b.dataset.cplay, S.ctx); return; }
  if (q('qcur')) togglePlay();
});

/* ---------------- Boot ---------------- */
(() => { // static film grain, drawn once
  try { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4){ const v = Math.random()*255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
    g.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${c.toDataURL('image/png')})`; } catch(e){}
})();
setVol(S.vol); renderNav(); renderMain(); updateNow(); paintProgress();
function afterLoad(){
  S.loaded = true;
  if (!byId(S.cur)){ const last = store.get('echo-last', null); S.cur = byId(last) ? last : (ctxIds('mine')[0] ?? null); S.ctx = 'mine'; }
  updateMedia(); refresh();
}
try { DB.all().then(rs => { (rs || []).sort((a, b) => a.added - b.added).forEach(r => { const t = addFileTrack(r); if (!r.tagged) enrich(t); }); afterLoad(); }).catch(afterLoad); } catch(e){ afterLoad(); }
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
